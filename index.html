<html lang="zh-Hant">
<head>

  <title>UNDERTALE — Opening Scene &amp; The Ruins</title>
  <style>
    :root {

      --foreground: #f4f4f6;
      --card: #13131b;
      --border: rgba(255, 255, 255, 0.16);
      --secondary: #1e1e2a;
      --secondary-foreground: #f4f4f6;
      --muted-foreground: #a1a1aa;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; min-height: 100%; }
    button, select { font: inherit; color: inherit; }
    h1, p { margin: 0; }
    canvas#game { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; display: block; width: 100%; height: auto; aspect-ratio: 4/3; max-width: 640px; }
    .ut-font { font-family: "Courier New", "Noto Sans Mono CJK TC", monospace; letter-spacing: 0.04em; }
    .dpad-btn { touch-action: manipulation; color: #f4f4f6; }
    .dpad-btn:active, .dpad-btn.pressed { transform: scale(0.93); filter: brightness(1.25); }
    .antialiased { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .m-0 { margin: 0; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .mt-0\.5 { margin-top: 0.125rem; }
    .p-3 { padding: 0.75rem; }
    .pt-1 { padding-top: 0.25rem; }
    .px-1\.5 { padding-left: 0.375rem; padding-right: 0.375rem; }
    .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
    .px-2\.5 { padding-left: 0.625rem; padding-right: 0.625rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-0\.5 { padding-top: 0.125rem; padding-bottom: 0.125rem; }
    .py-1\.5 { padding-top: 0.375rem; padding-bottom: 0.375rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .w-7 { width: 1.75rem; }
    .h-7 { height: 1.75rem; }
    .h-8 { height: 2rem; }
    .w-10 { width: 2.5rem; }
    .h-10 { height: 2.5rem; }
    .w-28 { width: 7rem; }
    .w-full { width: 100%; }
    .max-w-3xl { max-width: 48rem; }
    .max-w-\[640px\] { max-width: 640px; }
    .relative { position: relative; }
    .overflow-hidden { overflow: hidden; }
    .flex { display: flex; }
    .inline-flex { display: inline-flex; }
    .grid { display: grid; }
    .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .flex-col { flex-direction: column; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .shrink-0 { flex-shrink: 0; }
    .gap-1 { gap: 0.25rem; }
    .gap-1\.5 { gap: 0.375rem; }
    .gap-2\.5 { gap: 0.625rem; }
    .gap-3 { gap: 0.75rem; }
    .space-y-1 > * + * { margin-top: 0.25rem; }
    .space-y-3 > * + * { margin-top: 0.75rem; }
    .rounded { border-radius: 0.25rem; }
    .rounded-md { border-radius: 0.375rem; }
    .rounded-lg { border-radius: 0.5rem; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-full { border-radius: 9999px; }
    .border { border-width: 1px; border-style: solid; }
    .border-2 { border-width: 2px; border-style: solid; }
    .border-white\/80 { border-color: rgba(255, 255, 255, 0.8); }
    .border-\[var\(--border\)\] { border-color: var(--border); }
    .bg-black { background-color: #000; }
    .bg-black\/80 { background-color: rgba(0, 0, 0, 0.8); }
    .bg-\[var\(--background\)\] { background-color: var(--background); }
    .bg-\[var\(--card\)\] { background-color: var(--card); }
    .bg-\[var\(--secondary\)\] { background-color: var(--secondary); }
    .text-\[var\(--foreground\)\] { color: var(--foreground); }
    .text-\[var\(--muted-foreground\)\] { color: var(--muted-foreground); }
    .text-\[var\(--secondary-foreground\)\] { color: var(--secondary-foreground); }
    .text-red-500 { color: #ef4444; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-center { text-align: center; }
    .font-bold { font-weight: 700; }
    .font-medium { font-weight: 500; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .leading-none { line-height: 1; }
    .leading-tight { line-height: 1.25; }
    .tracking-wide { letter-spacing: 0.025em; }
    .shadow-lg { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4); }

    .disabled\:opacity-40:disabled { opacity: 0.4; cursor: not-allowed; }

<body class="bg-[var(--background)] text-[var(--foreground)] antialiased m-0 p-3 sm:p-5">
  <div class="max-w-3xl mx-auto space-y-3">
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <span class="inline-flex items-center justify-center w-7 h-7 rounded-md bg-black border border-white/80 text-red-500 text-sm font-bold leading-none">♥</span>
        <div>
          <h1 class="text-sm font-bold tracking-wide leading-tight ut-font">UNDERTALE — INTRO &amp; THE RUINS</h1>
          <p id="roomLabel" class="text-xs text-[var(--muted-foreground)] leading-tight mt-0.5">Intro Story (room_introstory)</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-1.5 text-xs">
        <button id="btnIntro" class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 font-medium cursor-pointer">0. Intro</button>
        <button id="btnRoom1" class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 font-medium cursor-pointer">1. Flower Bed</button>
        <button id="btnRoom2" class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 font-medium cursor-pointer">2. Flowey</button>
        <select id="roomSel" title="Jump to room" class="px-2 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] text-xs cursor-pointer"><option value="">Jump Room ▾</option></select>
        <button id="btnPhone" disabled class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-medium cursor-pointer disabled:opacity-40">📞 Phone [C]</button>
        <button id="btnDebug" class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-medium cursor-pointer">Map [G]</button>
        <button id="btnLang" class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-medium cursor-pointer">EN / 繁中</button>
        <button id="btnMute" class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-medium cursor-pointer">🔊 BGM</button>
        <button id="btnReset" class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-medium cursor-pointer">↺ Reset</button>
      </div>
    </div>
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-3 sm:p-4 flex flex-col items-center gap-3">
      <div class="relative w-full max-w-[640px] rounded-lg overflow-hidden border-2 border-[var(--border)] bg-black shadow-lg">
        <canvas id="game" width="320" height="240" tabindex="0"></canvas>
      </div>
      <div class="w-full max-w-[640px] flex flex-col sm:flex-row items-center justify-between gap-3 pt-1">
        <div class="text-xs text-[var(--muted-foreground)] space-y-1 text-center sm:text-left">
          <div><kbd class="px-1.5 py-0.5 rounded bg-[var(--secondary)] border border-[var(--border)] font-mono">↑↓←→</kbd> / <kbd class="px-1.5 py-0.5 rounded bg-[var(--secondary)] border border-[var(--border)] font-mono">WASD</kbd> Move · <kbd class="px-1.5 py-0.5 rounded bg-[var(--secondary)] border border-[var(--border)] font-mono">Z</kbd> Confirm · <kbd class="px-1.5 py-0.5 rounded bg-[var(--secondary)] border border-[var(--border)] font-mono">X</kbd> Skip · <kbd class="px-1.5 py-0.5 rounded bg-[var(--secondary)] border border-[var(--border)] font-mono">C</kbd> Phone</div>
          <p id="statusHint" class="text-xs text-[var(--muted-foreground)]">Press Z / Enter to advance story, or X to skip to Title Screen.</p>
        </div>
        <div class="flex items-center gap-3 shrink-0">
          <div class="grid grid-cols-3 gap-1 w-28">
            <div></div>
            <button data-key="ArrowUp" class="dpad-btn h-8 rounded bg-black/80 border border-[var(--border)] flex items-center justify-center cursor-pointer">▲</button>
            <div></div>
            <button data-key="ArrowLeft" class="dpad-btn h-8 rounded bg-black/80 border border-[var(--border)] flex items-center justify-center cursor-pointer">◀</button>
            <button data-key="ArrowDown" class="dpad-btn h-8 rounded bg-black/80 border border-[var(--border)] flex items-center justify-center cursor-pointer">▼</button>
            <button data-key="ArrowRight" class="dpad-btn h-8 rounded bg-black/80 border border-[var(--border)] flex items-center justify-center cursor-pointer">▶</button>
          </div>
          <div class="flex items-center gap-1.5">
            <button data-key="KeyX" class="dpad-btn w-10 h-10 rounded-full bg-black/80 border border-[var(--border)] flex items-center justify-center cursor-pointer">X</button>
            <button data-key="KeyZ" class="dpad-btn w-10 h-10 rounded-full bg-black/80 border border-[var(--border)] flex items-center justify-center cursor-pointer">Z</button>
          </div>
        </div>
      </div>
    </div>

window.drawUTText = function(ctx, text, x, y, color = '#ffffff', scale = 1) {
  ctx.fillStyle = color;
  if (/^[\x20-\x7E]*$/.test(text)) {
    let cx = Math.round(x);
    const cy = Math.round(y);
    for (let i = 0; i < text.length; i++) {
      const g = window.UT_GLYPHS[text[i]] || window.UT_GLYPHS[' '];
      for (let r = 0; r < 7; r++) {
        const row = g[r];
        for (let c = 0; c < 5; c++) {
          if (row & (1 << (4 - c))) ctx.fillRect(cx + c * scale, cy + r * scale, scale, scale);
        }
      }
      cx += 6 * scale;
    }
  } else {
    ctx.font = `bold ${scale > 1 ? 12 : 10}px "Microsoft JhengHei", "Noto Sans CJK TC", monospace`;
    ctx.textBaseline = 'top';
    ctx.fillText(text, Math.round(x), Math.round(y));
  }
};

// Undertale Web Audio Chiptune Synthesizer (Intro, Flowey, Ruins, Battle, Ghost, Home, Heartache)
window.SoundEngine = class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.currentTrack = null;
    this.bgmTimer = null;
    this.stepIdx = 0;
  }
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  tone(freq, dur, type = 'square', vol = 0.055, slideTo = null) {
    if (this.muted || !this.ctx || !freq) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + dur);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }
  voice(who) {
    if (who === 'flowey') this.tone(415 + Math.random() * 30, 0.045, 'square', 0.045);
    else if (who === 'flowey_evil') this.tone(135 + Math.random() * 25, 0.065, 'sawtooth', 0.055);
    else if (who === 'toriel') this.tone(275 + Math.random() * 15, 0.06, 'triangle', 0.065);
    else if (who === 'blook') this.tone(210 + Math.random() * 15, 0.05, 'sine', 0.05);
    else if (who === 'intro') this.tone(290, 0.04, 'square', 0.032);
    else this.tone(330, 0.038, 'square', 0.035);
  }
  sfxFlash() { this.tone(580, 0.07, 'square', 0.07); }
  sfxHit() { this.tone(160, 0.22, 'sawtooth', 0.09, 45); }
  sfxHeal() {
    this.tone(523, 0.1, 'triangle', 0.07);
    setTimeout(() => this.tone(659, 0.1, 'triangle', 0.07), 70);
    setTimeout(() => this.tone(784, 0.18, 'triangle', 0.08), 140);
  }
  sfxSave() {
    this.tone(659, 0.08, 'triangle', 0.06);
    setTimeout(() => this.tone(880, 0.16, 'triangle', 0.07), 85);
  }
  sfxFireball() { this.tone(240, 0.35, 'sawtooth', 0.08, 70); }
  sfxStep() { this.tone(120, 0.025, 'triangle', 0.014); }
  sfxTransition() { this.tone(190, 0.12, 'triangle', 0.025, 95); }
  sfxSelect() { this.tone(480, 0.04, 'square', 0.04); }
  sfxPhone() {
    this.tone(780, 0.06, 'square', 0.05);
    setTimeout(() => this.tone(920, 0.08, 'square', 0.05), 80);
  }

  playTrack(name) {
    if (this.currentTrack === name) return;
    this.stopTrack();
    this.currentTrack = name;
    this.stepIdx = 0;
    if (!name) return;

    const N = {
      A3:220.0, Bb3:233.1, B3:246.9,
      C4:261.6, Cs4:277.2, D4:293.7, Eb4:311.1, E4:329.6, F4:349.2, Fs4:370.0, G4:392.0, Ab4:415.3, A4:440.0, Bb4:466.2, B4:493.9,
      C5:523.3, Cs5:554.4, D5:587.3, Eb5:622.3, E5:659.3, F5:698.5, Fs5:740.0, G5:784.0
    };
    const tracks = {
      intro: {
        tempo: 360, wave: 'triangle', vol: 0.04,
        notes: [N.C4, N.C5, N.G4, N.F4, N.C5, N.C4, N.F4, N.G4,
                N.C4, N.C5, N.G4, N.F4, N.G4, N.E4, N.D4, 0]
      },
      cavern: {
        tempo: 420, wave: 'triangle', vol: 0.03,
        notes: [N.C4, 0, N.G4, 0, N.E4, 0, N.D4, 0, N.C4, 0, N.D4, 0, N.E4, 0, 0, 0]
      },
      flowey: {
        tempo: 200, wave: 'square', vol: 0.03,
        notes: [N.G4, N.E4, N.G4, N.C5, N.B4, N.G4, N.A4, 0,
                N.F4, N.D4, N.F4, N.B4, N.A4, N.G4, N.E4, 0,
                N.G4, N.E4, N.G4, N.C5, N.D5, N.C5, N.B4, N.A4,
                N.G4, N.E4, N.D4, N.E4, N.C4, 0, 0, 0]
      },
      fallen_down: {
        tempo: 280, wave: 'triangle', vol: 0.038,
        notes: [N.Fs4, N.D4, N.A3, N.Fs4, N.D4, N.A3,
                N.G4, N.E4, N.B3, N.G4, N.E4, N.B3,
                N.A4, N.Fs4, N.D4, N.G4, N.E4, N.C4,
                N.Fs4, N.D4, N.A3, N.D4, 0, 0]
      },
      ruins: {
        tempo: 240, wave: 'triangle', vol: 0.036,
        notes: [N.C4, N.E4, N.G4, N.D4, N.E4, N.B3, N.C4, 0,
                N.A3, N.C4, N.E4, N.B3, N.D4, N.C4, N.A3, 0,
                N.F4, N.E4, N.D4, N.C4, N.B3, N.D4, N.G4, 0,
                N.E4, N.D4, N.C4, N.B3, N.A3, 0, 0, 0]
      },
      battle: {
        tempo: 155, wave: 'square', vol: 0.028,
        notes: [N.E4, N.G4, N.B4, N.E5, N.D5, N.B4, N.G4, N.A4,
                N.E4, N.G4, N.B4, N.D5, N.C5, N.B4, N.A4, N.G4]
      },
      ghost: {
        tempo: 165, wave: 'square', vol: 0.028,
        notes: [N.C5, N.Eb5, N.G5, N.Eb5, N.C5, 0, N.B4, N.D5,
                N.C5, N.Eb5, N.F5, N.G5, N.Ab4, N.G4, N.F4, N.G4]
      },
      home: {
        tempo: 330, wave: 'triangle', vol: 0.04,
        notes: [N.E4, N.G4, N.C5, N.B4, N.A4, N.G4, N.E4, 0,
                N.F4, N.A4, N.C5, N.B4, N.G4, N.E4, N.D4, 0]
      },
      heartache: {
        tempo: 145, wave: 'square', vol: 0.032,
        notes: [N.A4, N.C5, N.E5, N.A4, N.B4, N.D5, N.F5, N.B4,
                N.C5, N.E5, N.G5, N.E5, N.D5, N.B4, N.G4, N.E4]
      }
    };
    const tr = tracks[name];
    if (!tr) return;
    this.bgmTimer = setInterval(() => {
      if (this.muted || !this.ctx || this.ctx.state !== 'running') return;
      const f = tr.notes[this.stepIdx % tr.notes.length];
      if (f) this.tone(f, (tr.tempo / 1000) * 0.85, tr.wave, tr.vol);
      this.stepIdx++;
    }, tr.tempo);
  }
  stopTrack() {
    if (this.bgmTimer) clearInterval(this.bgmTimer);
    this.bgmTimer = null;
    this.currentTrack = null;
  }
};

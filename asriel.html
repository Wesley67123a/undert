<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>UNDERTALE — Asriel Dreemurr (7 SOULs Battle Simulator)</title>
  <style>
    :root {
      --bg: #050507; --panel: #0e0e12; --border: #ffffff;
      --gold: #ffff00; --red: #ff2a2a; --muted: #a6a6b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; min-height: 100%; background: var(--bg); color: #fff;
      font-family: "Determination Mono", "Courier New", monospace;
      overflow-x: hidden; touch-action: manipulation; user-select: none;
    }
    .app-shell { max-width: 900px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 8px 10px 14px; gap: 8px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
      border: 2px solid rgba(255,255,255,0.22); background: var(--panel); padding: 8px 10px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .soul-badge {
      display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
      border: 2px solid #fff; font-size: 16px; animation: rainbowB 3s linear infinite;
    }
    @keyframes rainbowB {
      0% { color: #ff4a4a; border-color: #ff4a4a; }
      20% { color: #ffb84a; border-color: #ffb84a; }
      40% { color: #ffff4a; border-color: #ffff4a; }
      60% { color: #4aff7c; border-color: #4aff7c; }
      80% { color: #4ab8ff; border-color: #4ab8ff; }
      100% { color: #ff4aff; border-color: #ff4aff; }
    }
    .brand h1 { font-size: 14px; letter-spacing: 0.05em; }
    .brand p { font-size: 11px; color: var(--gold); }
    .mobile-quick { display: none; align-items: center; gap: 6px; flex-shrink: 0; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .ut-btn, .ut-select {
      font-family: inherit; font-size: 12px; color: #fff; background: #000;
      border: 2px solid #fff; padding: 5px 9px; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .ut-btn:hover, .ut-select:hover { border-color: var(--gold); color: var(--gold); }
    .ut-btn.rainbow { border-color: #4ab8ff; color: #9ee6ff; }
    .ut-btn.shield-on { background: #062b36; border-color: #48e8ff; color: #48e8ff; }
    .stage-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
    .canvas-frame {
      width: 100%; max-width: 720px; background: #000; border: 3px solid #fff;
      box-shadow: 0 0 35px rgba(140, 80, 255, 0.25); overflow: hidden;
    }
    canvas#game { display: block; width: 100%; height: auto; aspect-ratio: 4/3; image-rendering: pixelated; cursor: pointer; touch-action: none; }
    .hint-bar {
      width: 100%; max-width: 720px; border: 2px solid rgba(255,255,255,0.2); background: var(--panel);
      padding: 6px 10px; font-size: 12px; color: #e2e2ee; line-height: 1.4; overflow-wrap: anywhere;
    }
    .controls-deck {
      width: 100%; max-width: 720px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 2px 4px;
    }
    .kb-arrows {
      display: grid;
      grid-template-columns: repeat(3, clamp(64px, 19.2vw, 78px));
      grid-template-rows: repeat(2, clamp(60px, 16.5vw, 70px));
      gap: 6px;
      touch-action: none;
      flex-shrink: 0;
    }
    .kb-key {
      background: linear-gradient(180deg, #241e33 0%, #120f1a 100%);
      border: 2.5px solid rgba(158, 230, 255, 0.55);
      border-bottom: 5px solid rgba(158, 230, 255, 0.3);
      border-radius: 10px;
      color: #ffffff;
      font-size: 27px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; touch-action: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.65);
      transition: transform 0.04s, background 0.05s, border-color 0.05s;
    }
    .kb-key.up { grid-column: 2; grid-row: 1; }
    .kb-key.left { grid-column: 1; grid-row: 2; }
    .kb-key.down { grid-column: 2; grid-row: 2; }
    .kb-key.right { grid-column: 3; grid-row: 2; }
    .kb-key.active {
      background: linear-gradient(180deg, #4b3d0b 0%, #2a2104 100%);
      border-color: var(--gold); border-bottom-width: 2.5px; color: var(--gold);
      transform: translateY(2px); box-shadow: 0 0 14px rgba(255, 255, 0, 0.38);
    }
    .desktop-legend { text-align: center; font-size: 11px; color: var(--muted); line-height: 1.6; }
    .desktop-legend kbd { border: 1px solid rgba(255,255,255,0.4); background: #16161d; padding: 1px 5px; color: #fff; }
    .action-cluster { display: flex; align-items: center; gap: 8px; flex-shrink: 0; touch-action: none; }
    .act-btn {
      font-family: inherit; font-weight: bold; color: #fff;
      background: linear-gradient(180deg, #211d2c 0%, #110f18 100%);
      border: 2.5px solid #fff; border-bottom: 5px solid rgba(255,255,255,0.42);
      border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; touch-action: none;
    }
    .act-btn .k { font-size: 20px; } .act-btn .sub { font-size: 9px; color: var(--muted); }
    .act-btn.z-btn { width: 68px; height: 82px; border-color: var(--gold); border-bottom-color: #9e9610; }
    .act-btn.z-btn .k { color: var(--gold); }
    .act-btn.x-btn { width: 56px; height: 62px; }
    .act-btn.active, .act-btn:active { background: rgba(255,255,0,0.22); border-bottom-width: 2.5px; transform: translateY(2px); }
    @media (max-width: 720px) {
      .app-shell { padding: 5px 6px env(safe-area-inset-bottom, 8px); gap: 5px; }
      .topbar { padding: 5px 8px; gap: 6px; }
      .brand { flex: 1; min-width: 0; }
      .brand h1 { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .brand p { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .mobile-quick { display: inline-flex; }
      .toolbar { display: none; width: 100%; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.2); }
      .toolbar.open { display: flex; }
      .desktop-legend { display: none; }
      .ut-btn, .ut-select { font-size: 11px; padding: 4px 7px; }
      .hint-bar { font-size: 11.5px; padding: 5px 8px; }
      .controls-deck { padding: 10px 2px 6px; gap: 8px; }
      .act-btn.z-btn { width: 64px; height: 82px; }
      .act-btn.x-btn { width: 52px; height: 60px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="soul-badge" aria-hidden="true">★</span>
        <div style="min-width:0">
          <h1>ASRIEL DREEMURR — 7 SOULs BATTLE</h1>
          <p id="phaseLbl">Hopes &amp; Dreams / SAVE the World</p>
        </div>
      </div>
      <div class="mobile-quick">
        <button id="btnShieldQuick" class="ut-btn" type="button" title="Toggle Shield">🛡</button>
        <button id="btnMenuToggle" class="ut-btn rainbow" type="button">☰ 選單</button>
      </div>
      <div id="topToolbar" class="toolbar">
        <select id="modeSel" class="ut-select" aria-label="Jump to Battle Phase">
          <option value="">Jump Phase ▾</option>
          <option value="title">★ Simulator Title Menu</option>
          <option value="intro">0. Intro Transform</option>
          <option value="p1">1. Phase 1: Hopes &amp; Dreams</option>
          <option value="hypergoner">2. HYPER GONER</option>
          <option value="p2">3. Phase 2: Burn in Despair!</option>
          <option value="save">4. SAVE the World (Lost Souls)</option>
          <option value="finale">5. Finale: His Theme</option>
          <option value="single_menu">🎯 Single Attack Practice</option>
        </select>
        <button id="btnShield" class="ut-btn" type="button">🛡 Shield OFF</button>
        <button id="btnLang" class="ut-btn" type="button">EN / 繁中</button>
        <button id="btnMute" class="ut-btn" type="button">🔊 Audio</button>
        <a class="ut-btn" href="undyne.html">💚 Undying</a>
        <a class="ut-btn rainbow" href="index.html">🏠 Ruins &amp; Snowdin</a>
      </div>
    </header>

    <section class="stage-wrap">
      <div class="canvas-frame">
        <canvas id="game" width="640" height="480" tabindex="0"></canvas>
      </div>
      <div class="hint-bar" id="hintBar">
        ★ Choose <b>NORMAL</b> for the full 7 SOULs story, <b>PHASE SELECT</b> for checkpoints, or <b>SINGLE ATTACKS</b> to master all 10 patterns!
      </div>
      <div class="controls-deck">
        <div id="kbArrows" class="kb-arrows" role="group" aria-label="Simulated Keyboard Arrow Keys">
          <button type="button" class="kb-key up" data-dir="up" aria-label="Up Arrow">▲</button>
          <button type="button" class="kb-key left" data-dir="left" aria-label="Left Arrow">◀</button>
          <button type="button" class="kb-key down" data-dir="down" aria-label="Down Arrow">▼</button>
          <button type="button" class="kb-key right" data-dir="right" aria-label="Right Arrow">▶</button>
        </div>
        <div class="desktop-legend">
          <div><kbd>↑↓←→</kbd> / <kbd>WASD</kbd> Move / Shield / Jump</div>
          <div><kbd>Z</kbd> / <kbd>Enter</kbd> Confirm / Shoot · <kbd>X</kbd> / <kbd>Shift</kbd> Slow / Back</div>
        </div>
        <div class="action-cluster">
          <button id="btnX" class="act-btn x-btn" type="button"><span class="k">X</span><span class="sub">BACK</span></button>
          <button id="btnZ" class="act-btn z-btn" type="button"><span class="k">Z</span><span class="sub">OK</span></button>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/core_assets.js"></script>
  <script src="assets/asriel_assets.js"></script>
  <script src="assets/battle_engine.js"></script>
  <script src="assets/asriel_engine.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const sfx = new window.UTEngineCore.UTSoundEngine();
      const G = {
        lang: 'en',
        sfx,
        noHitShield: false,
        state: { name: 'FRISK', lv: 1, hp: 20, maxHp: 20 },
        keys: { up: false, down: false, left: false, right: false, cancel: false, moveScale: 1 },
        onUI: () => {
          const on = !!(G.noHitShield || window.UT_NO_HIT_SHIELD);
          for (const sid of ['btnShield', 'btnShieldQuick']) {
            const sb = document.getElementById(sid);
            if (!sb) continue;
            sb.classList.toggle('shield-on', on);
            sb.textContent = sid === 'btnShieldQuick' ? (on ? '🛡ON' : '🛡') : (on ? (G.lang === 'zh' ? '🛡 無傷護盾 ON' : '🛡 Shield ON') : (G.lang === 'zh' ? '🛡 無傷護盾 OFF' : '🛡 Shield OFF'));
          }
          document.getElementById('hintBar').innerHTML = G.lang === 'zh'
            ? '★ <b>完整決戰</b>體驗完整 7 靈魂劇情、<b>階段選擇</b>直達各經典名場面、或 <b>單一招式練習</b>無限專精全部 10 招彈幕！'
            : '★ Choose <b>NORMAL</b> for the full 7 SOULs story, <b>PHASE SELECT</b> for checkpoints, or <b>SINGLE ATTACKS</b> to master all 10 patterns!';
        },
      };
      const asriel = window.UTAsrielEngine.createAsrielBattle(G);
      window.UTAsrielSim = { G, asriel };
      const initMode = new URLSearchParams(location.search).get('mode') || 'title';
      asriel.open(initMode === 'single_menu' ? 'title' : initMode, true);
      if (initMode === 'single_menu') asriel.mode = 'single_menu';

      const kb = {}, ts = {};
      function sync() {
        for (const k of ['up', 'down', 'left', 'right', 'cancel']) G.keys[k] = !!(kb[k] || ts[k]);
        G.keys.moveScale = 1.0;
        document.querySelectorAll('[data-dir]').forEach(el => el.classList.toggle('active', !!G.keys[el.dataset.dir]));
      }
      const DIR = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
      window.addEventListener('keydown', e => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
        if (e.repeat) return;
        if (DIR[e.code]) { kb[DIR[e.code]] = true; asriel.onNav(DIR[e.code]); sync(); }
        else if (e.code === 'KeyZ' || e.code === 'Enter' || e.code === 'Space') asriel.onConfirm();
        else if (e.code === 'KeyX' || e.code === 'ShiftLeft' || e.code === 'Escape') { kb.cancel = true; asriel.onCancel(); sync(); }
      });
      window.addEventListener('keyup', e => {
        if (DIR[e.code]) { kb[DIR[e.code]] = false; sync(); }
        else if (e.code === 'KeyX' || e.code === 'ShiftLeft') { kb.cancel = false; sync(); }
      });

      // Huge simulated keyboard arrow pad (#kbArrows) with instant multi-touch & slide!
      const kbArrows = document.getElementById('kbArrows');
      const activeTouches = new Map();
      let mouseDir = null, repTimer = null, repDir = null;
      function dirAt(x, y) { return document.elementFromPoint(x, y)?.closest?.('[data-dir]')?.dataset.dir || null; }
      function stopRep() { if (repTimer) { clearTimeout(repTimer); clearInterval(repTimer); repTimer = null; } repDir = null; }
      function startRep(d) {
        stopRep(); repDir = d;
        repTimer = setTimeout(() => {
          repTimer = setInterval(() => {
            if (repDir && ts[repDir] && asriel.sub !== 'dodge') asriel.onNav(repDir);
            else if (!ts[repDir]) stopRep();
          }, 135);
        }, 235);
      }
      function recompute() {
        const prev = { up: ts.up, down: ts.down, left: ts.left, right: ts.right };
        ts.up = ts.down = ts.left = ts.right = false;
        for (const d of activeTouches.values()) if (d) ts[d] = true;
        if (mouseDir) ts[mouseDir] = true;
        for (const d of ['up', 'down', 'left', 'right']) {
          if (ts[d] && !prev[d]) { asriel.onNav(d); startRep(d); }
        }
        if (!ts.up && !ts.down && !ts.left && !ts.right) stopRep();
        sync();
      }
      kbArrows.addEventListener('touchstart', e => {
        e.preventDefault(); sfx.unlock();
        for (const t of e.changedTouches) {
          const d = t.target?.closest?.('[data-dir]')?.dataset.dir || dirAt(t.clientX, t.clientY);
          if (d) activeTouches.set(t.identifier, d);
        }
        recompute();
      }, { passive: false });
      kbArrows.addEventListener('touchmove', e => {
        e.preventDefault();
        for (const t of e.changedTouches) {
          if (!activeTouches.has(t.identifier)) continue;
          const d = dirAt(t.clientX, t.clientY);
          if (d) activeTouches.set(t.identifier, d); else activeTouches.delete(t.identifier);
        }
        recompute();
      }, { passive: false });
      const endT = e => { e.preventDefault(); for (const t of e.changedTouches) activeTouches.delete(t.identifier); recompute(); };
      kbArrows.addEventListener('touchend', endT, { passive: false });
      kbArrows.addEventListener('touchcancel', endT, { passive: false });
      kbArrows.addEventListener('mousedown', e => { const d = e.target?.closest?.('[data-dir]')?.dataset.dir; if (!d) return; e.preventDefault(); sfx.unlock(); mouseDir = d; recompute(); });
      window.addEventListener('mousemove', e => { if (!mouseDir) return; const d = dirAt(e.clientX, e.clientY); if (d && d !== mouseDir) { mouseDir = d; recompute(); } });
      window.addEventListener('mouseup', () => { if (mouseDir) { mouseDir = null; recompute(); } });

      const bindBtn = (id, fnD, fnU) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', e => { e.preventDefault(); sfx.unlock(); el.classList.add('active'); fnD(); }, { passive: false });
        el.addEventListener('touchend', e => { e.preventDefault(); el.classList.remove('active'); fnU?.(); }, { passive: false });
        el.addEventListener('touchcancel', e => { e.preventDefault(); el.classList.remove('active'); fnU?.(); }, { passive: false });
        el.addEventListener('mousedown', () => { sfx.unlock(); el.classList.add('active'); fnD(); });
        el.addEventListener('mouseup', () => { el.classList.remove('active'); fnU?.(); });
      };
      bindBtn('btnZ', () => asriel.onConfirm());
      bindBtn('btnX', () => { ts.cancel = true; asriel.onCancel(); sync(); }, () => { ts.cancel = false; sync(); });

      canvas.addEventListener('pointerdown', e => {
        const r = canvas.getBoundingClientRect();
        asriel.onCanvasTap(((e.clientX - r.left) / r.width) * 640, ((e.clientY - r.top) / r.height) * 480);
      });
      document.getElementById('btnMenuToggle').addEventListener('click', () => document.getElementById('topToolbar').classList.toggle('open'));
      document.getElementById('modeSel').addEventListener('change', e => {
        const v = e.target.value; e.target.value = ''; sfx.unlock();
        if (!v) return;
        document.getElementById('topToolbar').classList.remove('open');
        if (v === 'title' || v === 'phase_menu' || v === 'single_menu') { asriel.resetEntities(); asriel.mode = v; asriel.menuCursor = 0; }
        else asriel.startPhase(v);
      });
      const toggleSh = () => {
        sfx.unlock();
        window.UT_NO_HIT_SHIELD = !window.UT_NO_HIT_SHIELD;
        G.noHitShield = window.UT_NO_HIT_SHIELD;
        sfx.sfx(G.noHitShield ? 'heal' : 'select', 0.65);
        G.onUI();
      };
      document.getElementById('btnShield').addEventListener('click', toggleSh);
      document.getElementById('btnShieldQuick').addEventListener('click', toggleSh);
      document.getElementById('btnLang').addEventListener('click', () => { G.lang = G.lang === 'en' ? 'zh' : 'en'; G.onUI(); });
      document.getElementById('btnMute').addEventListener('click', e => { sfx.unlock(); sfx.setMuted(!sfx.muted); e.currentTarget.textContent = sfx.muted ? '🔇 Muted' : '🔊 Audio'; });

      let last = 0, acc = 0;
      function loop(now) {
        if (!last) last = now;
        acc += Math.min(50, now - last); last = now;
        while (acc >= 1000 / 60) {
          G.keys.moveScale = 1.0;
          asriel.update(G.keys);
          acc -= 1000 / 60;
        }
        ctx.imageSmoothingEnabled = false;
        asriel.render(ctx);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>

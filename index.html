    if (state.room <= 3) h = t.hints.intro;
    else if (state.room === 4) h = t.hints.area1;
    else if (state.room === 5) h = t.hints.area2;
    document.getElementById('statusHint').textContent = h;
    const phoneBtn = document.getElementById('btnPhone');
    if (phoneBtn) phoneBtn.disabled = !state.hasPhone;
    const dbg = document.getElementById('btnDebug');
    if (dbg) dbg.style.outline = showDebugMap ? '2px solid var(--primary)' : 'none';
  }

  function startFade(onMid) {
    sfx.sfxTransition();
    state.mode = 'fade';
    state.fade = { alpha: 0, dir: 1, onMid };
  }

  function startDialogue(entries, onDone, pos = 'auto') {
    const norm = entries.map(e => typeof e === 'string' ? { who: 'narrator', text: e } : e);
    state.mode = 'dialogue';
    state.dlg = {
      queue: norm, idx: 0, charPos: 0, tick: 0, onDone,
      pos: pos === 'auto' ? (state.frisk.y - state.camY > 125 ? 'top' : 'bottom') : pos
    };
    if (norm[0] && norm[0].expr) state.floweyExpr = norm[0].expr;
  }

  function sayKey(k, who = 'narrator', cb = null, pos = 'auto') {
    const arr = T()[k];
    if (!arr) return;
    const entries = arr.map(x => typeof x === 'string' ? { who, text: x } : x);
    startDialogue(entries, cb, pos);
  }

  // =========================================================================
  // ROOM ENTRY & TRANSITIONS (Official room IDs 1..43)
  // =========================================================================
  function enterRoom(id, x, y, dir = 'down') {
    const R = window.UT_ROOMS[id];
    if (!R) return;
    state.room = id;

    if (id === 1) {
      state.mode = 'intro';
      state.intro = { slide: 0, charPos: 0, tick: 0, panY: 0 };
      sfx.playTrack('intro');
      updateUI();
      return;
    }
    if (id === 2) {
      state.mode = 'intro_pan';
      state.intro.panY = 0;
      sfx.playTrack('intro');
      updateUI();
      return;
    }
    if (id === 3) {
      state.mode = 'title';
      sfx.stopTrack();
      updateUI();
      return;
    }

    state.mode = 'explore';
    state.frisk.x = x ?? (R.horiz ? 48 : 160);
    state.frisk.y = y ?? (R.horiz ? 132 : 202);
    state.frisk.dir = dir;
    state.frisk.moving = false;

    if (id === 4) {
      state.camX = 0; state.camY = 0;
      sfx.playTrack('cavern');
    } else if (id === 5) {
      state.camX = 0;
      state.camY = Math.max(0, Math.min(180, state.frisk.y - 120));
      state.floweyVisible = !state.story.floweyGone;
      sfx.playTrack(state.story.floweyGone ? 'fallen_down' : 'flowey');
    } else {
      // Ruins / Toriel's Home / Basement
      state.floweyVisible = (id === 43 && !state.story.floweyEndSeen);
      const ru = state.ruins;
      ru.seq = [];
      ru.rocks = (R.rocks && !ru.done[id]) ? R.rocks.map(p => ({ x: p[0], y: p[1] })) : [];
      const tor = ru.tor;
      tor.goal = null;
      const torShouldShow = R.torPos && !(id === 11 && ru.seen[11] === 2) && !(id === 33 && state.story.basementMet) && !(id === 41 && state.story.torielSpared);
      tor.vis = !!torShouldShow;
      if (R.torPos) {
        tor.x = R.torPos[0]; tor.y = R.torPos[1];
        tor.dir = id === 33 ? 'left' : 'down';
      }
      if (R.kind === 'home') sfx.playTrack('home');
      else if (id >= 38 && id <= 41) sfx.playTrack('fallen_down');
      else if (id === 43) sfx.stopTrack();
      else sfx.playTrack('ruins');
      updateCam();
    }
    updateUI();
  }

  function updateCam() {
    const R = window.UT_ROOMS[state.room];
    if (!R) return;
    if (state.room === 5) {
      state.camX = 0;
      const target = Math.max(0, Math.min(180, state.frisk.y - 125));
      state.camY += (target - state.camY) * 0.14;
      return;
    }
    const w = R.w || 320;
    state.camX = Math.max(0, Math.min(w - 320, state.frisk.x - 160));
    state.camY = 0;
  }

  // =========================================================================
  // COLLISIONS
  // =========================================================================
  function isSolidArea1(px, py) {
    const pts = [[px - 5, py - 2], [px + 5, py - 2], [px - 5, py + 4], [px + 5, py + 4]];
    for (const [x, y] of pts) {
      if (x >= 304 && y >= 138 && y <= 178) return false;
      const tx = Math.floor(x / 20), ty = Math.floor(y / 20);
      if (ty < 0 || ty >= ROOM1_MAP.length || tx < 0 || tx >= 16) return true;
      if (ROOM1_MAP[ty][tx] !== '#') return true;
    }
    return false;
  }

  function isSolidArea2(px, py) {
    const pts = [[px - 5, py - 2], [px + 5, py - 2], [px - 5, py + 4], [px + 5, py + 4]];
    for (const [x, y] of pts) {
      if (y >= 400 && x >= 115 && x <= 205) return false;
      if (y <= 176 && x >= 140 && x <= 180) return false;
      if (state.floweyVisible && Math.hypot(x - 160, y - 306) < 12) return true;
      const tx = Math.floor(x / 20), ty = Math.floor(y / 20);
      if (ty < 0 || ty >= ROOM2_WALLS.length || tx < 0 || tx >= 16) return true;
      if (ROOM2_WALLS[ty][tx] === '#') return true;
    }
    return false;
  }

  function inRect(r, x, y) { return x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3]; }

  function isSolidRuins(px, py) {
    const id = state.room, R = window.UT_ROOMS[id];
    const pts = [[px - 5, py - 2], [px + 5, py - 2], [px - 5, py + 4], [px + 5, py + 4]];
    for (const [x, y] of pts) {
      if (!R.floors.some(f => inRect(f, x, y))) return true;
      if (R.water && R.water.some(w => inRect(w, x, y)) && !(R.bridges && R.bridges.some(b => inRect(b, x, y)))) return true;
      if (!state.ruins.done[id] && R.spikes && R.spikes.some(s => inRect(s, x, y))) return true;
    }
    for (const o of (R.props || [])) {
      if (o.k === 'blook' && state.story.blookCleared) continue;
      if (o.k === 'froggit' && id === 10 && state.story.frogCleared) continue;
      if (o.hw && Math.abs(px - o.x) < o.hw + 4 && Math.abs(py - o.y) < 10) return true;
    }
    if (state.ruins.tor.vis && Math.abs(px - state.ruins.tor.x) < 12 && Math.abs(py - state.ruins.tor.y) < 8) return true;
    return false;
  }

  function tryMoveRuins(dx, dy) {
    const f = state.frisk, id = state.room, R = window.UT_ROOMS[id];
    const nx = f.x + dx, ny = f.y + dy;
    if (isSolidRuins(nx, ny)) return;
    for (const rk of state.ruins.rocks) {
      if (Math.abs(nx - rk.x) < 14 && Math.abs(ny - rk.y) < 14) {
        const rx = rk.x + dx, ry = rk.y + dy;
        const blocked = [[-8,-8],[8,-8],[-8,8],[8,8]].some(([cx,cy]) => !R.floors.some(fl => inRect(fl, rx+cx, ry+cy)));
        if (blocked) return;
        rk.x = rx; rk.y = ry;
      }
    }
    f.x = nx; f.y = ny;
  }

  // =========================================================================
  // FLOWEY BATTLE (room_area1_2)
  // =========================================================================
  function startFloweyBattle() {
    state.mode = 'flash';
    state.flashTimer = 36;
    sfx.sfxFlash();
    setTimeout(() => sfx.sfxFlash(), 120);
    setTimeout(() => sfx.sfxFlash(), 240);
    state.flashCb = () => {
      state.mode = 'flowey_battle';
      const b = state.fb;
      b.phase = 'intro'; b.waveNum = 0;
      b.soulX = 160; b.soulY = 166; b.invuln = 0; b.shake = 0;
      b.pellets = []; b.fireball = null;
      b.floweyX = 160; b.floweyY = 66; b.floweyVx = 0; b.timer = 0;
      queueFBDlg(T().floweyBattle.intro);
      updateUI();
    };
  }

  function queueFBDlg(list) {
    const b = state.fb;
    b.dlgQueue = list; b.dlgIdx = 0; b.dlgChar = 0; b.dlgTick = 0;
    if (list[0] && list[0].expr) state.floweyExpr = list[0].expr;
  }

  function spawnFBPellets(mul) {
    const b = state.fb; b.pellets = [];
    for (let i = 0; i < 5; i++) {
      b.pellets.push({ x: 118 + i * 21, y: 98 + Math.abs(i - 2) * 5, vx: 0, vy: 0, delay: 24 + i * 5, speed: 1.55 * mul, launched: false, rot: i * 0.7 });
    }
    b.timer = 0; b.phase = 'wave';
  }

  function spawnFBRing() {
    const b = state.fb; b.pellets = [];
    for (let i = 0; i < 16; i++) {
      const ang = (Math.PI * 2 * i) / 16;
      b.pellets.push({ ang, radius: 74, x: b.soulX + Math.cos(ang)*74, y: b.soulY + Math.sin(ang)*74, isRing: true, rot: ang });
    }
    b.phase = 'ring'; b.timer = 0;
  }

  function triggerFBEvil(hit) {
    sfx.stopTrack();
    state.fb.phase = 'evil_dlg';
    state.fb.pellets = [];
    queueFBDlg(hit ? T().floweyBattle.evilHit : T().floweyBattle.evilDodge);
  }

  function updateFloweyBattle() {
    const b = state.fb;
    if (b.shake > 0) b.shake--;
    if (b.invuln > 0) b.invuln--;

    if (b.phase === 'wave' || b.phase === 'ring') {
      let dx = 0, dy = 0;
      if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
      if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
      if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
      if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
      b.soulX = Math.max(b.box.x + 7, Math.min(b.box.x + b.box.w - 7, b.soulX + dx * 1.9));
      b.soulY = Math.max(b.box.y + 7, Math.min(b.box.y + b.box.h - 7, b.soulY + dy * 1.9));
    }

    if (b.dlgQueue.length > 0) {
      const cur = b.dlgQueue[b.dlgIdx];
      if (cur && b.dlgChar < cur.text.length) {
        b.dlgTick++;
        if (b.dlgTick >= 2) {
          b.dlgTick = 0; b.dlgChar++;
          const ch = cur.text[b.dlgChar - 1];
          if (ch && ch !== ' ' && ch !== '\n') sfx.voice(cur.expr === 'evil' || cur.expr === 'laugh' || cur.expr === 'pissed' ? 'flowey_evil' : 'flowey');
        }
      }
      return;
    }

    if (b.phase === 'wave') {
      b.timer++;
      let alive = 0;
      for (const p of b.pellets) {
        p.rot += 0.25;
        if (!p.launched) {
          p.delay--;
          if (p.delay <= 0) {
            p.launched = true;
            const ang = Math.atan2(b.soulY - p.y, b.soulX - p.x);
            p.vx = Math.cos(ang) * p.speed; p.vy = Math.sin(ang) * p.speed;
          }
          alive++;
        } else {
          p.x += p.vx; p.y += p.vy;
          if (p.x > -20 && p.x < 340 && p.y > -20 && p.y < 260) alive++;
          if (Math.hypot(p.x - b.soulX, p.y - b.soulY) < 7 && b.invuln === 0) {
            state.hp = 1; b.shake = 18; b.invuln = 40; sfx.sfxHit();
            triggerFBEvil(true); return;
          }
        }
      }
      if (alive === 0 && b.timer > 60) {
        b.waveNum++;
        if (b.waveNum === 1) queueFBDlg(T().floweyBattle.dodge1);
        else if (b.waveNum === 2) queueFBDlg(T().floweyBattle.dodge2);
        else triggerFBEvil(false);
      }
    } else if (b.phase === 'ring') {
      b.timer++;
      for (const p of b.pellets) {
        p.rot += 0.3; p.ang += 0.012;
        if (p.radius > 17) p.radius -= 0.42;
        p.x = b.soulX + Math.cos(p.ang) * p.radius;
        p.y = b.soulY + Math.sin(p.ang) * p.radius;
      }
      if (b.timer === 115) { b.pellets = []; state.hp = 20; sfx.sfxHeal(); state.floweyExpr = 'hurt'; }
      if (b.timer === 148) { b.phase = 'fireball'; b.fireball = { x: 310, y: b.floweyY }; sfx.sfxFireball(); }
    } else if (b.phase === 'fireball') {
      b.fireball.x -= 6.5;
      if (b.fireball.x <= b.floweyX + 8 && b.floweyVx === 0) { b.floweyVx = -7.5; b.shake = 14; sfx.sfxHit(); }
      if (b.floweyVx !== 0) { b.floweyX += b.floweyVx; b.floweyY -= 1.5; }
      if (b.floweyX < -40) {
        state.floweyVisible = false; state.story.floweyGone = true;
        state.story.torielActive = true; state.story.torielX = 250; state.story.torielY = 285;
        state.story.torielState = 'enter'; state.mode = 'cutscene';
        sfx.playTrack('fallen_down'); updateUI();
      }
    }
  }

  // =========================================================================
  // RPG TURN-BASED BATTLE ENGINE (Dummy, Froggit, Napstablook, Toriel)
  // =========================================================================
  function startRPGBattle(enemyId, afterWin) {
    state.mode = 'flash';
    state.flashTimer = 28;
    sfx.sfxFlash();
    setTimeout(() => sfx.sfxFlash(), 110);
    state.flashCb = () => {
      state.mode = 'rpg_battle';
      const b = state.rpg;
      b.enemy = enemyId;
      b.enemyMax = enemyId === 'toriel' ? 120 : (enemyId === 'blook' ? 88 : 30);
      b.enemyHp = b.enemyMax;
      b.spareable = (enemyId === 'dummy');
      b.turns = 0; b.hat = false;
      b.menu = 'main'; b.cursor = 0; b.subCursor = 0;
      b.afterWin = afterWin;
      b.bullets = []; b.shake = 0; b.invuln = 0;
      const en = lang === 'en';
      if (enemyId === 'dummy') { b.msg = en ? "* You encountered the Dummy." : "* 你遭遇了訓練用假人。"; sfx.playTrack('battle'); }
      if (enemyId === 'froggit') { b.msg = en ? "* Froggit hopped close!" : "* Froggit 蹦了過來！"; sfx.playTrack('battle'); }
      if (enemyId === 'blook') { b.msg = en ? "* Here comes Napstablook." : "* Napstablook 飄了過來。"; sfx.playTrack('ghost'); }
      if (enemyId === 'toriel') { b.msg = en ? "* Toriel blocks the way!" : "* 托麗爾擋住了去路！"; sfx.playTrack('heartache'); }
      b.msgChar = 0;
    };
  }

  function startEnemyAttack() {
    const b = state.rpg;
    b.menu = 'dodge';
    b.timer = 0;
    b.bullets = [];
    b.box = { x: 112, y: 120, w: 96, h: 66 };
    b.soulX = 160; b.soulY = 153;
    if (b.enemy === 'dummy') { b.timer = 90; } // Dummy doesn't attack!
  }

  function setBattleMsg(txt, nextMenu = 'dodge') {
    const b = state.rpg;
    b.msg = txt; b.msgChar = 0; b.menu = 'msg'; b._next = nextMenu;
  }

  function rpgConfirm() {
    const b = state.rpg;
    const en = lang === 'en';
    if (b.menu === 'msg') {
      if (b.msgChar < b.msg.length) { b.msgChar = b.msg.length; return; }
      if (b._next === 'win') {
        state.mode = 'explore';
        sfx.playTrack(state.room >= 38 && state.room <= 41 ? 'fallen_down' : 'ruins');
        if (b.afterWin) b.afterWin();
        return;
      }
      if (b._next === 'dodge') startEnemyAttack();
      else {
        b.menu = 'main';
        if (b.enemy === 'toriel' && b.spareable) b.msg = en ? "* Toriel looks through you." : "* 托麗爾的眼神透出動搖。";
        else b.msg = en ? "* What will you do?" : "* 你要做什麼？";
        b.msgChar = b.msg.length;
      }
      return;
    }
    if (b.menu === 'fight_bar') {
      const dist = Math.abs(b.barX - 160);
      const dmg = Math.max(4, Math.round(state.atk * 1.4 - dist * 0.25));
      b.enemyHp = Math.max(0, b.enemyHp - dmg);
      b.shake = 14; sfx.sfxHit();
      if (b.enemy === 'dummy') {
        setBattleMsg(en ? `* You hit the Dummy for ${dmg} dmg.\n* Toriel looks disappointed.` : `* 你打了假人 ${dmg} 點傷害。\n* 托麗爾看起來有點失望。`, 'win');
      } else if (b.enemy === 'blook') {
        b.enemyHp = b.enemyMax; // Ghosts can't die!
        setBattleMsg(en ? "* (You can't kill a ghost...)\n* Napstablook lowered its HP\n  out of politeness." : "* (你殺不死幽靈……)\n* Napstablook 禮貌地自己扣了一點 HP。", 'dodge');
      } else if (b.enemyHp <= 0) {
        state.gold += 20;
        setBattleMsg(en ? "* YOU WON!\n* You earned 0 EXP and 20 GOLD." : "* 你贏了！獲得 20 GOLD。", 'win');
      } else {
        setBattleMsg(en ? `* You dealt ${dmg} damage!` : `* 造成 ${dmg} 點傷害！`, 'dodge');
      }
      return;
    }
    if (b.menu === 'main') {
      sfx.sfxSelect();
      if (b.cursor === 0) { b.menu = 'fight_bar'; b.barX = 48; b.barDir = 1; }
      else if (b.cursor === 1) { b.menu = 'act'; b.subCursor = 0; }
      else if (b.cursor === 2) {
        if (state.items.length === 0) { setBattleMsg(en ? "* Your bag is empty!" : "* 你的背包裡沒有道具！", 'main'); }
        else { b.menu = 'item'; b.subCursor = 0; }
      }
      else if (b.cursor === 3) { b.menu = 'mercy'; b.subCursor = 0; }
      return;
    }
    if (b.menu === 'act') {
      sfx.sfxSelect();
      if (b.subCursor === 0) { // Check
        const chk = {
          dummy: en ? "* DUMMY - ATK 0 DEF 0\n* A cotton heart and button eye." : "* 假人 - ATK 0 DEF 0\n* 棉花心臟與鈕扣眼睛。",
          froggit: en ? "* FROGGIT - ATK 4 DEF 5\n* Life is difficult for this enemy." : "* FROGGIT - ATK 4 DEF 5\n* 生活對這隻青蛙來說很艱難。",
          blook: en ? "* NAPSTABLOOK - ATK 10 DEF 10\n* This monster doesn't seem\n  to have a sense of humor." : "* NAPSTABLOOK - ATK 10 DEF 10\n* 這隻怪物似乎沒什麼幽默感。",
          toriel: en ? "* TORIEL - ATK 80 DEF 80\n* Knows best for you." : "* 托麗爾 - ATK 80 DEF 80\n* 最為你著想的人。"
        }[b.enemy];
        setBattleMsg(chk, 'dodge');
      } else {
        if (b.enemy === 'dummy') {
          b.spareable = true;
          setBattleMsg(en ? "* You talk to the Dummy.\n* ...It doesn't seem much for\n  conversation. Toriel is happy!" : "* 你親切地和假人聊天。\n* ……它不太擅長聊天，但托麗爾很開心！", 'win');
        } else if (b.enemy === 'froggit') {
          b.spareable = true;
          setBattleMsg(en ? "* You compliment Froggit.\n* It didn't understand what you\n  said, but was flattered anyway." : "* 你稱讚了 Froggit。\n* 牠雖然聽不懂，但還是很開心！", 'dodge');
        } else if (b.enemy === 'blook') {
          b.turns++;
          if (b.turns >= 2) { b.hat = true; b.spareable = true; setBattleMsg(en ? "* Napstablook puts on a\n  Dapper Blook hat! (Spareable!)" : "* Napstablook 戴上了「紳士帽」！(可以寬恕了！)", 'dodge'); }
          else setBattleMsg(en ? "* You give Napstablook a\n  patient smile. It cheers up a bit." : "* 你對 Napstablook 露出溫柔微笑。\n* 它稍微振作了一點。", 'dodge');
        } else if (b.enemy === 'toriel') {
          setBattleMsg(en ? "* You couldn't think of any\n  conversation topics." : "* 你想不出任何話題……", 'dodge');
        }
      }
      return;
    }
    if (b.menu === 'item') {
      const it = state.items.splice(b.subCursor, 1)[0];
      const heal = it === 'Pie' ? 20 : 12;
      state.hp = Math.min(state.maxHp, state.hp + heal);
      sfx.sfxHeal();
      setBattleMsg(en ? `* You ate the ${it}! HP restored!` : `* 你吃了 ${it}！HP 恢復了！`, 'dodge');
      return;
    }
    if (b.menu === 'mercy') {
      sfx.sfxSelect();
      if (b.subCursor === 1 && b.enemy !== 'toriel') {
        setBattleMsg(en ? "* Escaped..." : "* 成功逃跑了……", 'win');
        return;
      }
      if (b.enemy === 'toriel') {
        b.turns++;
        if (b.turns >= 3) {
          b.spareable = true;
          state.story.torielSpared = true;
          setBattleMsg(en ? "* Toriel stops attacking.\n* \"...You really want to leave\n  so badly?\"" : "* 托麗爾停下了攻擊。\n* 「……你真的這麼想離開嗎？」", 'win');
        } else {
          setBattleMsg(en ? "* You SPARE Toriel.\n* She refuses to look at you." : "* 你選擇寬恕托麗爾。\n* 她別過頭去不敢看你。", 'dodge');
        }
        return;
      }
      if (b.spareable) {
        state.gold += 10;
        setBattleMsg(en ? "* YOU WON! Earned 0 EXP and 10G." : "* 你贏了！獲得 0 EXP 與 10G。", 'win');
      } else {
        setBattleMsg(en ? "* You spare the enemy...\n  (Try ACT first!)" : "* 對方還不想結束戰鬥。\n  (試試先用 ACT 行動！)", 'dodge');
      }
    }
  }

  function updateRPGBattle() {
    const b = state.rpg;
    if (b.shake > 0) b.shake--;
    if (b.invuln > 0) b.invuln--;

    if (b.menu === 'msg' && b.msgChar < b.msg.length) {
      b.msgChar += 0.6;
      if (Math.floor(b.msgChar) !== Math.floor(b.msgChar - 0.6)) sfx.voice(b.enemy === 'toriel' ? 'toriel' : (b.enemy === 'blook' ? 'blook' : 'narrator'));
      return;
    }
    if (b.menu === 'fight_bar') {
      b.barX += b.barDir * 4.2;
      if (b.barX > 272 || b.barX < 48) b.barDir *= -1;
      return;
    }
    if (b.menu === 'dodge') {
      b.timer++;
      let dx = 0, dy = 0;
      if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
      if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
      if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
      if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
      b.soulX = Math.max(b.box.x + 6, Math.min(b.box.x + b.box.w - 6, b.soulX + dx * 1.9));
      b.soulY = Math.max(b.box.y + 6, Math.min(b.box.y + b.box.h - 6, b.soulY + dy * 1.9));

      // Spawn pattern bullets
      if (b.enemy === 'froggit' && b.timer % 22 === 1 && b.timer < 110) {
        b.bullets.push({ x: 116 + Math.random() * 88, y: 120, vx: (b.soulX - 160) * 0.015, vy: 1.4 });
      } else if (b.enemy === 'blook' && b.timer % 12 === 1 && b.timer < 120) {
        b.bullets.push({ x: 116 + Math.random() * 88, y: 120, vx: 0, vy: 1.7 });
      } else if (b.enemy === 'toriel' && b.timer % 16 === 1 && b.timer < 120) {
        const side = (b.timer % 32 === 1) ? 1 : -1;
        b.bullets.push({ x: side > 0 ? 114 : 206, y: 126 + Math.random() * 50, vx: side * 1.35, vy: 0.35, fire: true });
      }

      for (const p of b.bullets) {
        p.x += p.vx; p.y += p.vy;
        if (Math.hypot(p.x - b.soulX, p.y - b.soulY) < 6 && b.invuln === 0) {
          // Toriel avoids killing you if HP low!
          if (b.enemy === 'toriel' && state.hp <= 3) continue;
          state.hp = Math.max(1, state.hp - 2);
          b.invuln = 32; b.shake = 10; sfx.sfxHit();
        }
      }
      if (b.timer > 150) {
        b.menu = 'main';
        b.msg = lang === 'en' ? "* Choose your next move." : "* 選擇你的下一步。";
        b.msgChar = b.msg.length;
      }
    }
  }

  // =========================================================================
  // INTERACTIONS (Z KEY)
  // =========================================================================
  function handleConfirm() {
    sfx.unlock();

    if (state.mode === 'intro') {
      const slideText = T().introSlides[state.intro.slide] || '';
      if (state.intro.charPos < slideText.length) { state.intro.charPos = slideText.length; return; }
      state.intro.slide++;
      if (state.intro.slide < T().introSlides.length) {
        state.intro.charPos = 0; state.intro.tick = 0;
      } else {
        startFade(() => enterRoom(2));
      }
      return;
    }
    if (state.mode === 'intro_pan') {
      startFade(() => enterRoom(3));
      return;
    }
    if (state.mode === 'title') {
      sfx.sfxSave();
      startFade(() => enterRoom(4, 152, 132, 'down'));
      return;
    }

    if (state.mode === 'dialogue') {
      const cur = state.dlg.queue[state.dlg.idx];
      if (state.dlg.charPos < cur.text.length) { state.dlg.charPos = cur.text.length; return; }
      state.dlg.idx++;
      if (state.dlg.idx < state.dlg.queue.length) {
        state.dlg.charPos = 0; state.dlg.tick = 0;
        if (state.dlg.queue[state.dlg.idx].expr) state.floweyExpr = state.dlg.queue[state.dlg.idx].expr;
      } else {
        const cb = state.dlg.onDone;
        state.mode = 'explore';
        if (cb) cb();
      }
      return;
    }

    if (state.mode === 'flowey_battle') {
      const b = state.fb;
      if (b.dlgQueue.length === 0) return;
      const cur = b.dlgQueue[b.dlgIdx];
      if (b.dlgChar < cur.text.length) { b.dlgChar = cur.text.length; return; }
      b.dlgIdx++;
      if (b.dlgIdx < b.dlgQueue.length) {
        b.dlgChar = 0; b.dlgTick = 0;
        if (b.dlgQueue[b.dlgIdx].expr) state.floweyExpr = b.dlgQueue[b.dlgIdx].expr;
      } else {
        b.dlgQueue = [];
        if (b.phase === 'intro') spawnFBPellets(1.0);
        else if (b.phase === 'wave') spawnFBPellets(b.waveNum === 1 ? 1.25 : 1.55);
        else if (b.phase === 'evil_dlg') spawnFBRing();
      }
      return;
    }

    if (state.mode === 'rpg_battle') { rpgConfirm(); return; }

    if (state.mode === 'explore') {
      const f = state.frisk, id = state.room;
      if (id === 4) {
        if (f.x >= 110 && f.x <= 192 && f.y >= 100 && f.y <= 156) sayKey('flowers');
        return;
      }
      if (id === 5) {
        if (state.floweyVisible && Math.hypot(f.x - 160, f.y - 310) < 42) triggerFloweyStory();
        else if (f.y < 195) sayKey('archLocked');
        return;
      }
      ruinsInteract();
    }
  }

  function handleSkip() {
    if (state.mode === 'intro') { startFade(() => enterRoom(3)); return; }
    if (state.mode === 'intro_pan') { startFade(() => enterRoom(3)); return; }
    if (state.mode === 'dialogue') { const c = state.dlg.queue[state.dlg.idx]; if (c) state.dlg.charPos = c.text.length; }
    if (state.mode === 'flowey_battle' && state.fb.dlgQueue.length) { const c = state.fb.dlgQueue[state.fb.dlgIdx]; if (c) state.fb.dlgChar = c.text.length; }
    if (state.mode === 'rpg_battle') {
      if (state.rpg.menu === 'msg') state.rpg.msgChar = state.rpg.msg.length;
      else if (state.rpg.menu !== 'main' && state.rpg.menu !== 'dodge' && state.rpg.menu !== 'fight_bar') { state.rpg.menu = 'main'; sfx.sfxSelect(); }
    }
  }

  function triggerFloweyStory() {
    state.story.floweyMet = true;
    state.frisk.dir = 'up'; state.frisk.moving = false;
    sayKey('floweyIntro', 'flowey', () => startFloweyBattle(), 'top');
  }

  function ruinsInteract() {
    const f = state.frisk, id = state.room, R = window.UT_ROOMS[id], ru = state.ruins;
    let best = null, bd = 1e9;
    for (const o of (R.props || [])) {
      const d = Math.hypot(f.x - o.x, f.y - o.y);
      if (d < 34 + (o.hw || 0) * 0.4 && d < bd) { best = o; bd = d; }
    }
    if (ru.tor.vis && Math.hypot(f.x - ru.tor.x, f.y - ru.tor.y) < 38 && Math.hypot(f.x - ru.tor.x, f.y - ru.tor.y) < bd) {
      best = { k: 'tor' };
    }
    if (!best) return;
    const k = best.k;
    if (k === 'save') { state.hp = state.maxHp; sfx.sfxSave(); sayKey(best.text); }
    else if (k === 'plaque' || k === 'mouse' || k === 'pie_tbl' || k === 'web_lg' || k === 'web_sm' || k === 'brick_v' || k === 'plant' || k === 'fire' || k === 'chair' || k === 'books' || k === 'table' || k === 'stove') sayKey(best.text);
    else if (k === 'froggit') {
      if (id === 10 && !state.story.frogCleared) {
        startRPGBattle('froggit', () => { state.story.frogCleared = true; });
      } else sayKey(best.tip || 'froggitTip');
    }
    else if (k === 'dummy') {
      if (!state.story.dummyCleared) startRPGBattle('dummy', () => { state.story.dummyCleared = true; });
      else sayKey('t_ruins4', 'toriel');
    }
    else if (k === 'blook') {
      if (!state.story.blookCleared) startRPGBattle('blook', () => { state.story.blookCleared = true; });
    }
    else if (k === 'candy') {
      state.story.candyCount++;
      if (state.story.candyCount <= 3) { state.items.push('Candy'); sfx.sfxHeal(); sayKey('candyTake'); }
      else if (state.story.candyCount === 4) { sfx.sfxHit(); sayKey('candySpill'); }
      else sayKey('candyEmpty');
    }
    else if (k === 'bake') {
      if (state.gold >= 7) { state.gold -= 7; state.items.push('Donut'); sfx.sfxHeal(); sayKey('bakeBuy'); }
      else sayKey('bakePoor');
    }
    else if (k === 'talk_rock') {
      state.story.talkRockStep++;
      if (state.story.talkRockStep === 1) sayKey('talkRock1');
      else if (state.story.talkRockStep === 2) { best.x = 200; best.y = 175; ru.done[17] = true; sfx.sfxHeal(); sayKey('talkRock2'); }
      else sayKey('talkRock3');
    }
    else if (k === 'knife') {
      if (!best.taken) { best.taken = true; state.atk += 3; sfx.sfxHeal(); sayKey('toyKnife'); }
    }
    else if (k === 'vegetoid') sayKey('vegLine');
    else if (k === 'bed') {
      state.story.homeReady = true;
      startFade(() => { state.hp = state.maxHp; if (!state.items.includes('Pie')) state.items.push('Pie'); sfx.sfxHeal(); });
      setTimeout(() => sayKey('homeBed'), 850);
    }
    else if (k === 'sw') {
      if (ru.done[id]) return;
      if (best.good) {
        ru.pressed[best.id] = true;
        const need = (R.props || []).filter(p => p.k === 'sw' && p.good);
        if (need.every(p => ru.pressed[p.id])) { ru.done[id] = true; sfx.sfxHeal(); }
        else sfx.sfxFlash();
        if (best.msg) sayKey(best.msg, 'toriel');
      } else { sfx.sfxHit(); sayKey(best.msg || 'sw_wrong', 'toriel'); }
    }
    else if (k === 'col') {
      if (best.good && !ru.done[id]) { ru.done[id] = true; sfx.sfxHeal(); sayKey('rockMove'); }
      else sfx.sfxHit();
    }
    else if (k === 'pit') {
      if (best.act === 'sw') { if (!ru.done[id]) { ru.done[id] = true; sfx.sfxHeal(); sayKey('rockMove'); } }
      else if (best.act === 'ribbon' && !best.taken) { best.taken = true; state.def += 3; sfx.sfxHeal(); sayKey('ribbonGet'); }
      else if (best.act === 'nap') sayKey('napCave');
      else if (best.act === 'veg') sayKey('vegLine');
      else sayKey('candyEmpty');
    }
    else if (k === 'tor') {
      if (id === 33) {
        state.story.homeTalk++;
        if (state.story.homeTalk === 1) sayKey('torielLiving1', 'toriel');
        else if (state.story.homeTalk === 2) sayKey('torielLiving2', 'toriel');
        else {
          sayKey('torielLiving3', 'toriel', () => {
            ru.tor.goal = { x: 266, y: 145, cb: () => { ru.tor.vis = false; state.story.basementMet = true; } };
          });
        }
      } else {
        sayKey('torielLiving1', 'toriel');
      }
    }
  }

  function callMom() {
    if (!state.hasPhone || state.mode !== 'explore') return;
    sfx.sfxPhone();
    const list = T().phoneCalls;
    const call = list[state.phoneCount % list.length];
    state.phoneCount++;
    startDialogue(call);
  }

  // =========================================================================
  // UPDATE LOOP
  // =========================================================================
  function update() {
    state.time++;
    for (const m of state.motes) {
      m.y += m.vy;
      if (m.y > 175) { m.y = 20; m.x = 90 + Math.random() * 140; }
    }

    if (state.mode === 'fade') {
      state.fade.alpha += 0.065 * state.fade.dir;
      if (state.fade.dir === 1 && state.fade.alpha >= 1) {
        state.fade.alpha = 1; state.fade.dir = -1;
        if (state.fade.onMid) state.fade.onMid();
      } else if (state.fade.dir === -1 && state.fade.alpha <= 0) {
        state.fade.alpha = 0;
        if (state.room === 1) state.mode = 'intro';
        else if (state.room === 2) state.mode = 'intro_pan';
        else if (state.room === 3) state.mode = 'title';
        else state.mode = 'explore';
      }
      return;
    }

    if (state.mode === 'intro') {
      const txt = T().introSlides[state.intro.slide] || '';
      if (state.intro.charPos < txt.length) {
        state.intro.tick++;
        if (state.intro.tick >= 2) {
          state.intro.tick = 0; state.intro.charPos++;
          const ch = txt[state.intro.charPos - 1];
          if (ch && ch !== ' ' && ch !== '\n') sfx.voice('intro');
        }
      }
      return;
    }
    if (state.mode === 'intro_pan') {
      if (state.intro.panY < 32) state.intro.panY += 0.22;
      else if (state.time % 180 === 0) startFade(() => enterRoom(3));
      return;
    }
    if (state.mode === 'title') return;

    if (state.mode === 'flash') {
      state.flashTimer--;
      if (state.flashTimer <= 0 && state.flashCb) { const cb = state.flashCb; state.flashCb = null; cb(); }
      return;
    }
    if (state.mode === 'flowey_battle') { updateFloweyBattle(); return; }
    if (state.mode === 'rpg_battle') { updateRPGBattle(); return; }

    if (state.mode === 'dialogue') {
      const cur = state.dlg.queue[state.dlg.idx];
      if (cur && state.dlg.charPos < cur.text.length) {
        state.dlg.tick++;
        if (state.dlg.tick >= 2) {
          state.dlg.tick = 0; state.dlg.charPos++;
          const ch = cur.text[state.dlg.charPos - 1];
          if (ch && ch !== ' ' && ch !== '\n' && ch !== '*') sfx.voice(cur.who);
        }
      }
      return;
    }

    if (state.mode === 'cutscene') {
      if (state.story.torielState === 'enter') {
        if (state.story.torielX > 160) state.story.torielX -= 1.3;
        else {
          state.story.torielX = 160; state.story.torielState = 'talk';
          sayKey('torielRescue', 'toriel', () => { state.story.torielState = 'leave'; state.mode = 'cutscene'; }, 'bottom');
        }
      } else if (state.story.torielState === 'leave') {
        state.story.torielY -= 1.5;
        state.camY += (Math.max(0, Math.min(180, state.story.torielY - 120)) - state.camY) * 0.06;
        if (state.story.torielY < 146) {
          state.story.torielActive = false; state.story.torielState = 'gone'; state.mode = 'explore';
        }
      }
      return;
    }

    // Explore mode
    const f = state.frisk;
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) dy += 1;

    f.moving = dx !== 0 || dy !== 0;
    if (f.moving) {
      if (dy > 0) f.dir = 'down'; else if (dy < 0) f.dir = 'up'; else if (dx < 0) f.dir = 'left'; else f.dir = 'right';
      const spd = 1.7;
      if (state.room === 4) {
        if (dx && !isSolidArea1(f.x + dx * spd, f.y)) f.x += dx * spd;
        if (dy && !isSolidArea1(f.x, f.y + dy * spd)) f.y += dy * spd;
      } else if (state.room === 5) {
        if (dx && !isSolidArea2(f.x + dx * spd, f.y)) f.x += dx * spd;
        if (dy && !isSolidArea2(f.x, f.y + dy * spd)) f.y += dy * spd;
      } else {
        if (dx) tryMoveRuins(dx * spd, 0);
        if (dy) tryMoveRuins(0, dy * spd);
      }
      f.walkTick++;
      if (f.walkTick % 16 === 8) sfx.sfxStep();
    } else f.walkTick = 0;

    updateCam();

    if (state.room === 4 && f.x > 306) { startFade(() => enterRoom(5, 160, 386, 'up')); return; }
    if (state.room === 5) {
      if (f.y > 408) { startFade(() => enterRoom(4, 290, 156, 'left')); return; }
      if (!state.story.floweyMet && state.floweyVisible && f.y < 344) { triggerFloweyStory(); return; }
      if (f.y < 164 && f.x >= 140 && f.x <= 180) {
        state.story.ruinsEntered = true;
        startFade(() => enterRoom(6, 160, 208, 'up'));
        return;
      }
    }

    if (state.room >= 6) updateRuinsEvents();
  }

  function updateRuinsEvents() {
    const id = state.room, R = window.UT_ROOMS[id], f = state.frisk, ru = state.ruins;
    const T_npc = ru.tor;
    if (T_npc.goal) {
      const gx = T_npc.goal.x - T_npc.x, gy = T_npc.goal.y - T_npc.y, d = Math.hypot(gx, gy);
      if (d < 2) { T_npc.moving = false; const cb = T_npc.goal.cb; T_npc.goal = null; if (cb) cb(); }
      else {
        T_npc.x += gx / d * 1.6; T_npc.y += gy / d * 1.6; T_npc.moving = true; T_npc.tick++;
        T_npc.dir = Math.abs(gx) > Math.abs(gy) ? (gx > 0 ? 'right' : 'left') : (gy > 0 ? 'down' : 'up');
      }
    } else T_npc.moving = false;

    // Room 7 Middle Road auto-demonstration
    if (id === 7 && !ru.seen[7]) {
      ru.seen[7] = 1;
      sayKey('t_ruins2', 'toriel', () => {
        for (const p of R.props) if (p.good) ru.pressed[p.id] = true;
        ru.done[7] = true; sfx.sfxHeal();
      });
      return;
    }
    if (id === 8 && !ru.seen[8]) { ru.seen[8] = 1; sayKey('t_ruins3', 'toriel'); return; }
    if (id === 9 && !ru.seen[9]) { ru.seen[9] = 1; sayKey('t_ruins4', 'toriel'); return; }
    if (id === 10 && !ru.seen[10]) { ru.seen[10] = 1; sayKey('t_ruins5', 'toriel'); return; }
    if (id === 11 && !ru.seen[11]) {
      ru.seen[11] = 1;
      sayKey('t_ruins6_start', 'toriel', () => { T_npc.goal = { x: 560, y: 120 }; });
      return;
    }
    if (id === 11 && ru.seen[11] === 1 && f.x > 520) {
      ru.seen[11] = 2; state.hasPhone = true; updateUI();
      sayKey('t_ruins6_end', 'toriel', () => { T_npc.goal = { x: 645, y: 130, cb: () => { T_npc.vis = false; } }; });
      return;
    }
    if (id === 28 && !ru.seen[28]) {
      ru.seen[28] = 1; state.hp = state.maxHp; sfx.sfxHeal();
      sayKey('t_home_front', 'toriel', () => { T_npc.goal = { x: 160, y: 122, cb: () => { T_npc.vis = false; } }; });
      return;
    }
    if (id === 38 && !ru.seen[38]) {
      ru.seen[38] = 1;
      sayKey('basement1', 'toriel', () => { T_npc.goal = { x: 470, y: 128, cb: () => { T_npc.vis = false; } }; });
      return;
    }
    if (id === 41 && !ru.seen[41] && !state.story.torielSpared) {
      ru.seen[41] = 1;
      sayKey('basement4', 'toriel', () => startRPGBattle('toriel', () => {
        sayKey('torielSpared', 'toriel', () => { ru.tor.vis = false; });
      }));
      return;
    }
    if (id === 43 && !state.story.floweyEndSeen && f.y < 175) {
      state.story.floweyEndSeen = true;
      sayKey('floweyEnd', 'flowey', () => { state.floweyVisible = false; });
      return;
    }

    // Blueprint spike check (Room 10)
    if (R.field) {
      const fl = R.field;
      const c = Math.floor((f.x - fl.x) / 20), r = Math.floor((f.y - fl.y) / 20);
      if (c >= 0 && c < fl.cols && r >= 0 && r < fl.rows && !fl.safe.some(s => s[0] === c && s[1] === r)) {
        state.hp = Math.max(1, state.hp - 1); sfx.sfxHit();
        f.x = 100; f.y = 148;
      }
    }
    // Cracked leaf path check (Room 16)
    if (R.crackField) {
      const cf = R.crackField;
      const c = Math.floor((f.x - cf.x) / 20), r = Math.floor((f.y - cf.y) / 20);
      if (c >= 0 && c < cf.cols && r >= 0 && r < cf.rows && !cf.safe.some(s => s[0] === c && s[1] === r)) {
        sfx.sfxTransition(); f.x = 65; f.y = 140;
      }
    }
    // Rock puzzle plate check (Room 15)
    if (R.plate && !ru.done[id]) {
      for (const rk of ru.rocks) if (Math.hypot(rk.x - R.plate[0], rk.y - R.plate[1]) < 10) {
        rk.x = R.plate[0]; rk.y = R.plate[1]; ru.done[id] = true; sfx.sfxHeal();
      }
    }

    // Door transitions
    if (R.doors) {
      for (const d of R.doors) {
        if (f.x >= d.x && f.x <= d.x + d.w && f.y >= d.y && f.y <= d.y + d.h) {
          if (d.needBlook && !state.story.blookCleared) return;
          if (d.needTorielClear && !state.story.torielSpared) return;
          startFade(() => enterRoom(d.to, d.sx, d.sy, d.dir));
          return;
        }
      }
    }
    if (R.horizExit && f.x >= R.horizExit.x && f.y <= R.horizExit.y) {
      const ex = R.horizExit;
      startFade(() => enterRoom(ex.to, ex.sx, ex.sy, ex.dir)); return;
    }
    if (R.north && f.y < 66 && f.x >= 136 && f.x <= 184) {
      startFade(() => enterRoom(R.north[1], R.north[2], R.north[3], R.north[4])); return;
    }
    if (R.south && f.y > 224) {
      startFade(() => enterRoom(R.south[0], R.south[1], R.south[2], R.south[3])); return;
    }
    if (R.horiz) {
      if (R.west && f.x < 26) {
        const wRoom = window.UT_ROOMS[R.west];
        startFade(() => enterRoom(R.west, R.sxWest || ((wRoom.w || 320) - 46), R.syWest || 132, 'left'));
        return;
      }
      if (R.east && f.x > (R.w || 320) - 26) {
        startFade(() => enterRoom(R.east, 44, 132, 'right'));
        return;
      }
    }
    if (id === 43 && f.y < 68 && f.x >= 136 && f.x <= 184) {
      sayKey('theEndRuins', 'narrator', () => { f.y = 95; });
    }
  }

  // =========================================================================
  // RENDERERS
  // =========================================================================
  function drawFrisk(cx, cy) {
    const f = state.frisk;
    if (!IMG.frisk.complete || !IMG.frisk.naturalWidth) return;
    const row = { down: 0, left: 1, right: 2, up: 3 }[f.dir] || 0;
    const col = f.moving ? (Math.floor(f.walkTick / 8) % 4) : 0;
    ctx.drawImage(IMG.frisk, col * 20, row * 30, 20, 30, Math.round(cx - 10), Math.round(cy - 26), 20, 30);
  }

  function drawTorielOW(x, y, dir, moving, tick) {
    if (!IMG.tor_ow.complete || !IMG.tor_ow.naturalWidth) return;
    const row = { down: 0, left: 1, right: 2, up: 3 }[dir] || 0;
    const col = moving ? (Math.floor(tick / 9) % 4) : 0;
    ctx.drawImage(IMG.tor_ow, col * 32, row * 58, 32, 58, Math.round(x - 16), Math.round(y - 52), 32, 58);
  }

  function renderIntro() {
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, 320, 240);
    if (state.mode === 'intro') {
      const idx = state.intro.slide;
      const im = IMG.intro[idx];
      if (im && im.complete && im.naturalWidth) {
        const sc = 2;
        const dw = im.width * sc, dh = im.height * sc;
        const dx = Math.round((320 - dw) / 2), dy = Math.round(28 + (90 - dh) / 2);
        ctx.drawImage(im, dx, dy, dw, dh);
      }
      const txt = (T().introSlides[idx] || '').slice(0, state.intro.charPos);
      txt.split('\n').forEach((ln, i) => window.drawUTText(ctx, ln, 48, 148 + i * 16, '#ffffff', 1));
      if (state.intro.charPos >= (T().introSlides[idx] || '').length && Math.floor(state.time / 18) % 2 === 0) {
        window.drawUTText(ctx, '▼', 274, 214, '#fff200', 1);
      }
    } else if (state.mode === 'intro_pan') {
      const im = IMG.intro[11];
      if (im && im.complete && im.naturalWidth) {
        const sy = Math.min(32, Math.floor(state.intro.panY));
        ctx.drawImage(im, 0, sy, im.width, 60, 74, 30, 172, 120);
      }
    } else if (state.mode === 'title') {
      const logo = IMG.intro[12];
      if (logo && logo.complete && logo.naturalWidth) {
        ctx.drawImage(logo, 32, 34, 256, 170);
      }
      if (Math.floor(state.time / 24) % 2 === 0) {
        window.drawUTText(ctx, T().pressZ, 102, 198, '#808080', 1);
      }
    }
  }

  function fillStadium(x, y, w, h, c) {
    ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(w, h) / 2); ctx.fill();
  }

  function renderArea1() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 320, 240);
    ctx.fillStyle = '#3a3948';
    for (let ty = 0; ty < 12; ty++) for (let tx = 0; tx < 16; tx++) if (ROOM1_MAP[ty][tx] === '#') ctx.fillRect(tx * 20, ty * 20, 20, 20);
    fillStadium(72, 102, 156, 60, '#5f5e77');
    fillStadium(88, 102, 124, 60, '#c8c2e2');
    fillStadium(106, 102, 88, 60, '#22b14c');
    if (IMG.flower_bed.complete) ctx.drawImage(IMG.flower_bed, 120, 104);
    for (const m of state.motes) { ctx.fillStyle = `rgba(255,248,180,${m.a})`; ctx.fillRect(Math.round(m.x), Math.round(m.y), 1, 1); }
    drawFrisk(state.frisk.x, state.frisk.y);
  }

  function renderArea2() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 320, 240);
    ctx.save(); ctx.translate(0, -Math.round(state.camY));
    if (IMG.arch_ruins.complete) ctx.drawImage(IMG.arch_ruins, 108, 88);
    fillStadium(81, 300, 158, 40, '#3a3948');
    fillStadium(101, 300, 118, 40, '#5f5e77');
    fillStadium(121, 300, 78, 40, '#c8c2e2');
    fillStadium(140, 301, 40, 19, '#22b14c');
    if (state.floweyVisible && IMG.flw_faces.complete) {
      const bob = Math.sin(state.time * 0.08) > 0.35 ? 1 : 0;
      ctx.drawImage(IMG.flw_faces, 0, 0, 27, 29, 147, 285 + bob, 26, 26);
    }
    const acts = [{ y: state.frisk.y, t: 'f' }];
    if (state.story.torielActive) acts.push({ y: state.story.torielY, t: 't' });
    acts.sort((a, b) => a.y - b.y);
    for (const a of acts) a.t === 'f' ? drawFrisk(state.frisk.x, state.frisk.y) : drawTorielOW(state.story.torielX, state.story.torielY, 'up', true, state.time);
    if (showDebugMap) {
      for (let ty = 7; ty < 21; ty++) for (let tx = 0; tx < 16; tx++) if (ROOM2_WALLS[ty][tx] === '#') {
        ctx.strokeStyle = '#000055'; ctx.strokeRect(tx*20+0.5, ty*20+0.5, 19, 19);
      }
    }
    ctx.restore();
  }

  function renderRuins() {
    const id = state.room, R = window.UT_ROOMS[id];
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 320, 240);
    ctx.save(); ctx.translate(-Math.round(state.camX), 0);

    // Optional Balcony City Skyline backdrop
    if (R.castleView && IMG.castle.complete) ctx.drawImage(IMG.castle, 0, 0, 320, 152);

    // Brick walls above floors (non-home)
    if (R.kind !== 'home' && !R.castleView && IMG.brick.complete) {
      for (const [fx, fy, fw] of R.floors) {
        if (fy < 70) continue;
        for (let bx = fx; bx < fx + fw; bx += 20) ctx.drawImage(IMG.brick, 0, 0, Math.min(20, fx + fw - bx), 40, bx, fy - 40, Math.min(20, fx + fw - bx), 40);
      }
    }

    // Floors
    for (const [fx, fy, fw, fh] of R.floors) {
      if (R.kind === 'home') {
        ctx.fillStyle = '#f5dfb8'; ctx.fillRect(fx, fy - 28, fw, 28);
        ctx.fillStyle = '#e8c9a0'; ctx.fillRect(fx, fy, fw, fh);
        ctx.fillStyle = '#d2a877';
        for (let yy = fy; yy < fy + fh; yy += 12) ctx.fillRect(fx, yy, fw, 1);
      } else {
        ctx.fillStyle = '#a349a4'; ctx.fillRect(fx, fy, fw, fh);
        ctx.fillStyle = '#84357d'; ctx.fillRect(fx, fy, fw, 3);
      }
    }

    // Room 6 Ruins Entrance Double Staircase
    if (R.stairs && IMG.stair.complete) ctx.drawImage(IMG.stair, 15, 28, 290, 154);

    // Water & Bridges
    if (R.water && IMG.water.complete) {
      for (const [wx, wy, ww, wh] of R.water) {
        for (let y = wy; y < wy + wh; y += 20)
          for (let x = wx; x < wx + ww; x += 20) ctx.drawImage(IMG.water, x, y, Math.min(20, wx + ww - x), Math.min(20, wy + wh - y));
      }
    }
    if (R.bridges && IMG.bridge.complete) {
      for (const [bx, by, bw, bh] of R.bridges) ctx.drawImage(IMG.bridge, bx, by, bw, bh);
    }

    // Blueprint / Spike Field
    if (R.field) {
      const fl = R.field;
      for (let c = 0; c < fl.cols; c++) for (let r = 0; r < fl.rows; r++) {
        const safe = fl.safe.some(s => s[0] === c && s[1] === r);
        const tx = fl.x + c * 20, ty = fl.y + r * 20;
        if (safe) { ctx.fillStyle = '#c880d8'; ctx.fillRect(tx, ty, 20, 20); }
        else if (IMG.spk_up.complete) ctx.drawImage(IMG.spk_up, tx, ty + 1, 20, 18);
      }
    }
    if (R.crackField) {
      const cf = R.crackField;
      for (let c = 0; c < cf.cols; c++) for (let r = 0; r < cf.rows; r++) {
        const tx = cf.x + c * 20, ty = cf.y + r * 20;
        if (IMG.crack.complete) ctx.drawImage(IMG.crack, tx, ty, 20, 20);
        if (cf.safe.some(s => s[0] === c && s[1] === r)) {
          ctx.fillStyle = 'rgba(210, 30, 30, 0.35)'; ctx.fillRect(tx + 6, ty + 6, 8, 8);
        }
      }
    }

    // Door spikes
    if (R.spikes) {
      const spImg = state.ruins.done[id] ? IMG.spk_dn : IMG.spk_up;
      if (spImg.complete) {
        for (const [sx, sy, sw, sh] of R.spikes) {
          for (let y = sy; y < sy + sh; y += 18) for (let x = sx; x < sx + sw; x += 20) ctx.drawImage(spImg, x, y);
        }
      }
    }

    // Rock Plate
    if (R.plate && IMG.plate_up.complete) {
      ctx.drawImage(state.ruins.done[id] ? IMG.plate_dn : IMG.plate_up, R.plate[0] - 8, R.plate[1] - 5);
    }

    // Toriel's Home purple front door on Room 28
    if (R.homeExterior && IMG.ruin_door.complete) {
      ctx.drawImage(IMG.ruin_door, 141, 68);
    }
    if (id === 41 && IMG.ruin_door.complete) {
      ctx.drawImage(IMG.ruin_door, 141, 24);
    }
    if (id === 43 && IMG.arch_ruins.complete) {
      ctx.drawImage(IMG.arch_ruins, 108, 22);
    }
    // Home doorway markers
    if (R.kind === 'home' && R.doors) {
      ctx.fillStyle = '#b48a5a';
      for (const d of R.doors) ctx.fillRect(d.x, d.y, d.w, d.h);
    }

    // Props
    for (const o of (R.props || [])) {
      const x = o.x, y = o.y;
      if (o.k === 'leaf' && IMG.leaf.complete) ctx.drawImage(IMG.leaf, x - 15, y - 15);
      else if (o.k === 'plaque' && IMG.plaque.complete) ctx.drawImage(IMG.plaque, x - 9, y - 14);
      else if (o.k === 'plate' && IMG.plate_up.complete) ctx.drawImage(state.ruins.pressed[o.id] ? IMG.plate_dn : IMG.plate_up, x - 8, y - 5);
      else if (o.k === 'sw' && IMG.sw_off.complete) ctx.drawImage(state.ruins.pressed[o.id] ? IMG.sw_on : IMG.sw_off, x - 4, y - 10);
      else if (o.k === 'arrows' && IMG.arrows.complete) ctx.drawImage(IMG.arrows, x - 20, y - 18);
      else if (o.k === 'pillar' && IMG.pillar.complete) ctx.drawImage(IMG.pillar, x - 16, y - 54);
      else if (o.k === 'ivy' && IMG.ivy.complete) ctx.drawImage(IMG.ivy, x - 16, y - 54);
      else if (o.k === 'broken' && IMG.broken.complete) ctx.drawImage(IMG.broken, x - 19, y - 40);
      else if (o.k === 'pit' && IMG.pit.complete) ctx.drawImage(IMG.pit, x - 10, y - 5);
      else if (o.k === 'web_lg' && IMG.web_lg.complete) ctx.drawImage(IMG.web_lg, x - 18, y - 16);
      else if (o.k === 'web_sm' && IMG.web_sm.complete) ctx.drawImage(IMG.web_sm, x - 10, y - 10);
      else if (o.k === 'pie_tbl' && IMG.pie_tbl.complete) ctx.drawImage(IMG.pie_tbl, x - 13, y - 12);
      else if (o.k === 'mouse' && IMG.mouse.complete) ctx.drawImage(IMG.mouse, x - 5, y - 8);
      else if (o.k === 'brick_v' && IMG.brick_v.complete) ctx.drawImage(IMG.brick_v, x, y);
      else if (o.k === 'candy') {
        const im = state.story.candyCount >= 4 ? IMG.candy2 : IMG.candy1;
        if (im.complete) ctx.drawImage(im, x - 12, y - 24);
      }
      else if (o.k === 'col') {
        const im = o.c === 'red' ? IMG.col_red : (o.c === 'blue' ? IMG.col_blue : IMG.col_grn);
        if (im.complete) ctx.drawImage(im, x - 9, y - 10);
      }
      else if (o.k === 'tree') {
        if (IMG.tree_sh.complete) ctx.drawImage(IMG.tree_sh, x - 36, y + 6);
        if (IMG.tree.complete) ctx.drawImage(IMG.tree, x - 52, y - 78);
      }
      else if (o.k === 'froggit' && !(id === 10 && state.story.frogCleared) && IMG.froggit.complete) {
        const fr = Math.floor(state.time / 18) % 2;
        ctx.drawImage(IMG.froggit, fr * 16, 0, 16, 16, x - 8, y - 14, 16, 16);
      }
      else if (o.k === 'vegetoid' && IMG.vegetoid.complete) ctx.drawImage(IMG.vegetoid, x - 7, y - 14);
      else if (o.k === 'talk_rock' && IMG.talk_rock.complete) ctx.drawImage(IMG.talk_rock, x - 8, y - 10);
      else if (o.k === 'dummy' && IMG.dummy.complete) ctx.drawImage(IMG.dummy, x - 10, y - 30);
      else if (o.k === 'blook' && !state.story.blookCleared && IMG.blook_lie.complete) ctx.drawImage(IMG.blook_lie, x - 17, y - 14);
      else if (o.k === 'save') {
        const p = Math.sin(state.time * 0.1) * 1.5;
        ctx.fillStyle = '#fff200';
        ctx.fillRect(x - 1, y - 12 + p, 2, 12); ctx.fillRect(x - 6, y - 7 + p, 12, 2); ctx.fillRect(x - 3, y - 9 + p, 6, 6);
      }
      else if (o.k === 'bake') {
        ctx.fillStyle = '#7a4a2a'; ctx.fillRect(x - 16, y - 10, 32, 16);
        if (IMG.web_sm.complete) ctx.drawImage(IMG.web_sm, x - 10, y - 18);
      }
      else if (o.k === 'knife' && !o.taken) {
        ctx.fillStyle = '#90e0ff'; ctx.fillRect(x - 5, y - 3, 7, 2); ctx.fillStyle = '#e06060'; ctx.fillRect(x + 2, y - 4, 4, 4);
      }
      else if (o.k === 'fire') {
        ctx.fillStyle = '#6b4a2a'; ctx.fillRect(x - 22, y - 34, 44, 34);
        ctx.fillStyle = '#180c08'; ctx.fillRect(x - 14, y - 22, 28, 22);
        const fl = Math.floor(state.time / 6) % 3;
        ctx.fillStyle = '#ff7a00'; ctx.fillRect(x - 8, y - 12 - fl, 16, 12 + fl);
      }
      else if (o.k === 'chair') { ctx.fillStyle = '#9b6a38'; ctx.fillRect(x - 10, y - 14, 20, 18); }
      else if (o.k === 'books') { ctx.fillStyle = '#6a4224'; ctx.fillRect(x - 18, y - 32, 36, 32); }
      else if (o.k === 'table') { ctx.fillStyle = '#9b6a38'; ctx.fillRect(x - 26, y - 12, 52, 20); }
      else if (o.k === 'bed') {
        ctx.fillStyle = '#7a4a2a'; ctx.fillRect(x - 22, y - 22, 44, 28);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 20, y - 20, 40, 12);
        ctx.fillStyle = '#67a4e0'; ctx.fillRect(x - 20, y - 8, 40, 12);
      }
      else if (o.k === 'plant') {
        ctx.fillStyle = '#7a4a2a'; ctx.fillRect(x - 6, y - 6, 12, 10);
        ctx.fillStyle = '#2e9d3c'; ctx.fillRect(x - 2, y - 20, 4, 14);
      }
      else if (o.k === 'stove') { ctx.fillStyle = '#d8d8d8'; ctx.fillRect(x - 28, y - 22, 56, 22); }
    }

    // Rocks
    for (const rk of state.ruins.rocks) {
      if (IMG.rock.complete) ctx.drawImage(IMG.rock, rk.x - 10, rk.y - 10);
    }
    if (state.room === 43 && state.floweyVisible && IMG.flw_faces.complete) {
      ctx.drawImage(IMG.flw_faces, 4 * 27, 0, 27, 29, 147, 115, 26, 26);
    }

    // Depth-sorted actors
    const acts = [{ y: state.frisk.y, t: 'f' }];
    if (state.ruins.tor.vis) acts.push({ y: state.ruins.tor.y, t: 't' });
    acts.sort((a, b) => a.y - b.y);
    for (const a of acts) a.t === 'f' ? drawFrisk(state.frisk.x, state.frisk.y) : drawTorielOW(state.ruins.tor.x, state.ruins.tor.y, state.ruins.tor.dir, state.ruins.tor.moving, state.ruins.tor.tick);

    ctx.restore();
    window.drawUTText(ctx, `HP ${state.hp}/${state.maxHp}`, 6, 6, '#ffffff', 1);
    if (state.hasPhone) window.drawUTText(ctx, '[C] PHONE', 256, 6, '#fff200', 1);
  }

  function renderDialogueBox() {
    const cur = state.dlg.queue[state.dlg.idx];
    if (!cur) return;
    const boxX = 16, boxY = state.dlg.pos === 'top' ? 10 : 162, boxW = 288, boxH = 68;
    ctx.fillStyle = '#000'; ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(boxX + 1.5, boxY + 1.5, boxW - 3, boxH - 3);

    let textX = boxX + 12;
    const talking = state.dlg.charPos < cur.text.length && (Math.floor(state.time / 5) % 2 === 1);
    if (cur.who === 'flowey' && IMG.flw_faces.complete) {
      const fi = FLW_IDX[cur.expr || state.floweyExpr] || 0;
      ctx.drawImage(IMG.flw_faces, fi * 27, 0, 27, 29, boxX + 12, boxY + 11, 40, 44);
      textX = boxX + 60;
    } else if (cur.who === 'toriel' && IMG.tor_faces.complete) {
      const tf = (cur.expr === 'happy' ? 2 : (cur.expr === 'side' ? 4 : 0)) + (talking ? 1 : 0);
      ctx.drawImage(IMG.tor_faces, tf * 32, 0, 32, 32, boxX + 10, boxY + 10, 46, 46);
      textX = boxX + 62;
    }
    cur.text.slice(0, state.dlg.charPos).split('\n').forEach((ln, i) => window.drawUTText(ctx, ln, textX, boxY + 12 + i * 15, '#ffffff', 1));
    if (state.dlg.charPos >= cur.text.length && Math.floor(state.time / 18) % 2 === 0) window.drawUTText(ctx, '▼', boxX + boxW - 16, boxY + boxH - 16, '#fff200', 1);
  }

  function renderFloweyBattle() {
    const b = state.fb;
    ctx.save();
    if (b.shake > 0) ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 320, 240);
    const fi = FLW_IDX[state.floweyExpr] || 0;
    const bob = Math.sin(state.time * 0.1) * 1.5;
    if (IMG.flw_faces.complete) ctx.drawImage(IMG.flw_faces, fi * 27, 0, 27, 29, Math.round(b.floweyX - 27), Math.round(b.floweyY - 29 + bob), 54, 58);

    if (b.fireball) {
      ctx.fillStyle = '#ff6a00'; ctx.beginPath(); ctx.arc(b.fireball.x, b.fireball.y, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff200'; ctx.beginPath(); ctx.arc(b.fireball.x - 1, b.fireball.y, 5, 0, Math.PI * 2); ctx.fill();
    }
    if (b.dlgQueue.length > 0) {
      const cur = b.dlgQueue[b.dlgIdx];
      const bx = 190, by = 20, bw = 122, bh = 70;
      ctx.fillStyle = '#fff'; ctx.fillRect(bx, by, bw, bh);
      ctx.beginPath(); ctx.moveTo(bx, by + 26); ctx.lineTo(bx - 8, by + 31); ctx.lineTo(bx, by + 36); ctx.fill();
      cur.text.slice(0, b.dlgChar).split('\n').forEach((ln, i) => window.drawUTText(ctx, ln, bx + 5, by + 8 + i * 12, '#000000', 1));
    }
    ctx.fillStyle = '#000'; ctx.fillRect(b.box.x, b.box.y, b.box.w, b.box.h);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(b.box.x + 1.5, b.box.y + 1.5, b.box.w - 3, b.box.h - 3);
    if (b.invuln === 0 || Math.floor(b.invuln / 4) % 2 === 0) ctx.drawImage(SOUL_CANVAS, Math.round(b.soulX - 4.5), Math.round(b.soulY - 4.5));

    for (const p of b.pellets) {
      if (IMG.pellet.complete) {
        const pf = Math.floor(state.time / 5) % 2;
        ctx.drawImage(IMG.pellet, pf * 10, 0, 10, 10, Math.round(p.x - 5), Math.round(p.y - 5), 10, 10);
      }
    }
    window.drawUTText(ctx, 'FRISK   LV 1', 42, 215, '#ffffff', 1);
    window.drawUTText(ctx, 'HP', 152, 215, '#ffffff', 1);
    ctx.fillStyle = '#ff0000'; ctx.fillRect(172, 213, 40, 10);
    ctx.fillStyle = '#fff200'; ctx.fillRect(172, 213, Math.round(40 * (state.hp / state.maxHp)), 10);
    window.drawUTText(ctx, `${state.hp} / ${state.maxHp}`, 218, 215, '#ffffff', 1);
    ctx.restore();
  }

  function renderRPGBattle() {
    const b = state.rpg;
    ctx.save();
    if (b.shake > 0) ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 320, 240);

    // Draw enemy centered above box
    const bob = Math.sin(state.time * 0.08) * 2;
    if (b.enemy === 'dummy' && IMG.dummy.complete) ctx.drawImage(IMG.dummy, 141, 44, 38, 68);
    else if (b.enemy === 'froggit' && IMG.froggit.complete) {
      const fr = Math.floor(state.time / 16) % 2;
      ctx.drawImage(IMG.froggit, fr * 16, 0, 16, 16, 136, 52 + bob, 48, 48);
    } else if (b.enemy === 'blook' && IMG.blook_stand.complete) {
      ctx.drawImage(IMG.blook_stand, 142, 34 + bob, 36, 68);
      if (b.hat) { ctx.fillStyle = '#fff'; ctx.fillRect(150, 24 + bob, 20, 10); ctx.fillRect(146, 32 + bob, 28, 3); }
    } else if (b.enemy === 'toriel' && IMG.tor_ow.complete) {
      ctx.drawImage(IMG.tor_ow, 0, 0, 32, 58, 128, 16, 64, 100);
    }

    // Battle box
    const bx = b.menu === 'dodge' ? b.box.x : 18;
    const by = b.menu === 'dodge' ? b.box.y : 120;
    const bw = b.menu === 'dodge' ? b.box.w : 284;
    const bh = b.menu === 'dodge' ? b.box.h : 66;
    ctx.fillStyle = '#000'; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(bx + 1.5, by + 1.5, bw - 3, bh - 3);

    if (b.menu === 'dodge') {
      if (b.invuln === 0 || Math.floor(b.invuln / 4) % 2 === 0) ctx.drawImage(SOUL_CANVAS, Math.round(b.soulX - 4.5), Math.round(b.soulY - 4.5));
      for (const p of b.bullets) {
        ctx.fillStyle = p.fire ? '#ffaa40' : '#ffffff';
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
      }
    } else if (b.menu === 'fight_bar') {
      ctx.strokeStyle = '#808080'; ctx.strokeRect(48, 134, 224, 38);
      ctx.fillStyle = '#fff200'; ctx.fillRect(159, 132, 2, 42);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(b.barX) - 2, 130, 4, 46);
    } else if (b.menu === 'act') {
      const opts = ['* Check', b.enemy === 'blook' ? '* Cheer' : (b.enemy === 'froggit' ? '* Compliment' : '* Talk')];
      opts.forEach((op, i) => {
        window.drawUTText(ctx, op, 46, 132 + i * 18, '#ffffff', 1);
        if (b.subCursor === i) ctx.drawImage(SOUL_CANVAS, 32, 131 + i * 18);
      });
    } else if (b.menu === 'item') {
      state.items.slice(0, 3).forEach((it, i) => {
        window.drawUTText(ctx, `* ${it}`, 46, 132 + i * 16, '#ffffff', 1);
        if (b.subCursor === i) ctx.drawImage(SOUL_CANVAS, 32, 131 + i * 16);
      });
    } else if (b.menu === 'mercy') {
      const opts = [b.spareable ? '* Spare (Yellow!)' : '* Spare', '* Flee'];
      opts.forEach((op, i) => {
        window.drawUTText(ctx, op, 46, 132 + i * 18, (i === 0 && b.spareable) ? '#fff200' : '#ffffff', 1);
        if (b.subCursor === i) ctx.drawImage(SOUL_CANVAS, 32, 131 + i * 18);
      });
    } else {
      const shown = b.msg.slice(0, Math.floor(b.msgChar));
      shown.split('\n').forEach((ln, i) => window.drawUTText(ctx, ln, 30, 130 + i * 15, '#ffffff', 1));
    }

    // Stats + 4 Action Buttons
    window.drawUTText(ctx, `FRISK   LV 1   HP ${state.hp}/${state.maxHp}`, 18, 192, '#ffffff', 1);
    const btns = ['FIGHT', 'ACT', 'ITEM', 'MERCY'];
    btns.forEach((lbl, i) => {
      const x = 18 + i * 72, y = 208, active = (b.menu === 'main' && b.cursor === i);
      ctx.strokeStyle = active ? '#fff200' : '#ff7a00';
      ctx.lineWidth = 1.5; ctx.strokeRect(x, y, 64, 22);
      window.drawUTText(ctx, lbl, x + 16, y + 7, active ? '#fff200' : '#ff7a00', 1);
      if (active) ctx.drawImage(SOUL_CANVAS, x + 5, y + 6);
    });
    ctx.restore();
  }

  function render() {
    if (state.room <= 3) renderIntro();
    else if (state.mode === 'flowey_battle') renderFloweyBattle();
    else if (state.mode === 'rpg_battle') renderRPGBattle();
    else {
      if (state.room === 4) renderArea1();
      else if (state.room === 5) renderArea2();
      else renderRuins();

      if (state.mode === 'flash') {
        if (Math.floor(state.flashTimer / 4) % 2 === 0) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 320, 240); }
        ctx.drawImage(SOUL_CANVAS, Math.round(state.frisk.x - state.camX - 4), Math.round(state.frisk.y - state.camY - 12));
      }
      if (state.mode === 'dialogue') renderDialogueBox();
    }
    if (state.fade.alpha > 0) {
      ctx.fillStyle = `rgba(0,0,0,${Math.min(1, state.fade.alpha)})`;
      ctx.fillRect(0, 0, 320, 240);
    }
  }

  // =========================================================================
  // INPUT & INITIALIZATION
  // =========================================================================
  function handleMenuMove(dir) {
    if (state.mode !== 'rpg_battle') return;
    const b = state.rpg;
    sfx.sfxSelect();
    if (b.menu === 'main') b.cursor = (b.cursor + (dir === 'left' ? 3 : dir === 'right' ? 1 : 0)) % 4;
    else if (b.menu === 'act' || b.menu === 'mercy') b.subCursor = (b.subCursor + 1) % 2;
    else if (b.menu === 'item' && state.items.length) b.subCursor = (b.subCursor + (dir === 'up' ? -1 : 1) + Math.min(3, state.items.length)) % Math.min(3, state.items.length);
  }

  window.addEventListener('keydown', (e) => {
    const k = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(k)) e.preventDefault();
    sfx.unlock();
    if (!keys[k]) {
      if (k === 'KeyZ' || k === 'Enter' || k === 'Space') handleConfirm();
      else if (k === 'KeyX' || k === 'ShiftLeft' || k === 'ShiftRight') handleSkip();
      else if (k === 'KeyC') callMom();
      else if (k === 'KeyG') { showDebugMap = !showDebugMap; updateUI(); }
      else if (k === 'KeyM') toggleMute();
      else if (k === 'ArrowLeft' || k === 'KeyA') handleMenuMove('left');
      else if (k === 'ArrowRight' || k === 'KeyD') handleMenuMove('right');
      else if (k === 'ArrowUp' || k === 'KeyW') handleMenuMove('up');
      else if (k === 'ArrowDown' || k === 'KeyS') handleMenuMove('down');
    }
    keys[k] = true;
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  // Inject official IMG_6299 Controller Sprites into on-screen gamepad buttons
  const padImgs = { ArrowUp: B.ctrl_up, ArrowDown: B.ctrl_down, ArrowLeft: B.ctrl_left, ArrowRight: B.ctrl_right, KeyX: B.ctrl_x, KeyZ: B.ctrl_o };
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const code = btn.dataset.key;
    if (padImgs[code]) {
      btn.innerHTML = `<img src="data:image/png;base64,${padImgs[code]}" style="image-rendering:pixelated;height:${code.startsWith('Key') ? 24 : 20}px;width:auto;" alt="${code}"/>`;
    }
    const press = (ev) => {
      ev.preventDefault(); sfx.unlock(); btn.classList.add('pressed');
      if (!keys[code]) {
        if (code === 'KeyZ') handleConfirm();
        else if (code === 'KeyX') handleSkip();
        else if (code === 'ArrowLeft') handleMenuMove('left');
        else if (code === 'ArrowRight') handleMenuMove('right');
        else if (code === 'ArrowUp') handleMenuMove('up');
        else if (code === 'ArrowDown') handleMenuMove('down');
      }
      keys[code] = true;
    };
    const release = (ev) => { ev.preventDefault(); btn.classList.remove('pressed'); keys[code] = false; };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  });

  // Populate room selector dropdown
  const sel = document.getElementById('roomSel');
  if (sel && window.RUINS_JUMP_LIST) {
    for (const [id, label] of window.RUINS_JUMP_LIST) {
      const opt = document.createElement('option'); opt.value = id; opt.textContent = label; sel.appendChild(opt);
    }
    sel.addEventListener('change', (e) => {
      const id = parseInt(e.target.value, 10); e.target.value = ''; if (!id) return;
      sfx.unlock(); canvas.focus();
      startFade(() => enterRoom(id));
    });
  }

  document.getElementById('btnIntro')?.addEventListener('click', () => { sfx.unlock(); startFade(() => enterRoom(1)); });
  document.getElementById('btnRoom1')?.addEventListener('click', () => { sfx.unlock(); startFade(() => enterRoom(4, 152, 132, 'down')); });
  document.getElementById('btnRoom2')?.addEventListener('click', () => { sfx.unlock(); startFade(() => enterRoom(5, 160, 386, 'up')); });
  document.getElementById('btnPhone')?.addEventListener('click', () => { sfx.unlock(); callMom(); });
  document.getElementById('btnDebug')?.addEventListener('click', () => { showDebugMap = !showDebugMap; updateUI(); });
  document.getElementById('btnLang')?.addEventListener('click', () => { lang = lang === 'en' ? 'zh' : 'en'; updateUI(); });
  function toggleMute() {
    sfx.muted = !sfx.muted;
    const m = document.getElementById('btnMute');
    if (m) m.textContent = sfx.muted ? '🔇 Muted' : '🔊 BGM';
  }
  document.getElementById('btnMute')?.addEventListener('click', () => { sfx.unlock(); toggleMute(); });
  document.getElementById('btnReset')?.addEventListener('click', () => {
    sfx.unlock();
    state.hp = 20; state.items = []; state.hasPhone = false; state.gold = 15; state.atk = 10; state.def = 10;
    state.story = { floweyMet: false, floweyGone: false, floweyEndSeen: false, torielActive: false, torielX: 255, torielY: 295, torielState: 'idle', ruinsEntered: false, candyCount: 0, talkRockStep: 0, blookCleared: false, dummyCleared: false, frogCleared: false, homeReady: false, homeTalk: 0, basementMet: false, torielSpared: false };
    state.ruins = { done: {}, seen: {}, pressed: {}, seq: [], rocks: [], tor: { x: 160, y: 120, dir: 'down', moving: false, tick: 0, vis: false, goal: null } };
    startFade(() => enterRoom(1));
  });

  canvas.addEventListener('pointerdown', () => { canvas.focus(); sfx.unlock(); });

  let lastTs = 0, acc = 0;
  function loop(ts) {
    if (!lastTs) lastTs = ts;
    acc += Math.min(50, ts - lastTs); lastTs = ts;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    render();
    requestAnimationFrame(loop);
  }

  enterRoom(1);
  requestAnimationFrame(loop);
})();

</script>
</body>
</html>

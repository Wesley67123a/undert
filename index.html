<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Playable 1:1 recreation of UNDERTALE — Opening Story & Complete Ruins Walkthrough (Rooms 1–43) with authentic Determination fonts, sprites, OST, battles, and mobile touch controls." />
  <title>UNDERTALE — The Ruins (1:1 Playable Recreation &amp; Full Walkthrough)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath fill='%23ff2020' d='M3 3h3v1h1v1h2V4h1V3h3v1h1v4h-1v2h-2v2H9v1H7v-1H5v-2H3V8H2V4h1z'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #050507;
      --surface: #0d0d11;
      --surface-2: #16161d;
      --fg: #f8f8fa;
      --muted: #a0a0ab;
      --border: #ffffff;
      --border-dim: rgba(255, 255, 255, 0.22);
      --soul: #ff2424;
      --gold: #ffff00;
      --btn-orange: #ff7f27;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: "Determination Sans", "Determination Mono", "PingFang TC", "Noto Sans TC", monospace;
      overflow-x: hidden;
    }

    .app-shell {
      max-width: 820px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: 10px 12px env(safe-area-inset-bottom, 12px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Top Bar */
    .topbar {
      background: var(--surface);
      border: 2px solid var(--border-dim);
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .soul-badge {
      width: 26px;
      height: 26px;
      background: #000;
      border: 2px solid #fff;
      color: var(--soul);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      line-height: 1;
      flex-shrink: 0;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.06em;
      font-weight: 700;
      line-height: 1.15;
    }

    .brand-text p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--gold);
      font-family: "Determination Mono", monospace;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .ut-btn, .ut-select {
      background: #000;
      color: var(--fg);
      border: 2px solid var(--border-dim);
      padding: 5px 9px;
      font-family: "Determination Mono", "PingFang TC", monospace;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s, transform 0.08s;
    }

    .ut-btn:hover, .ut-select:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .ut-btn:active {
      transform: scale(0.96);
    }

    .ut-btn.danger { background:#3a0000; border-color:#ff2a2a; color:#ff5050; }
    .ut-btn.rainbow { background:#110824; border-color:#68d0ff; color:#bfefff; text-decoration:none; }
    .ut-btn.rainbow:hover { border-color:#ff7ce5; color:#ffff80; }
    .ut-btn.hero { background:#062016; border-color:#38ff7a; color:#7cffaa; text-decoration:none; }
    .ut-btn.hero:hover { border-color:#48e8ff; color:#ffff80; }
    .ut-btn.shield-on { background:#062b36; border-color:#48e8ff; color:#48e8ff; }
    .ut-btn.accent {
      border-color: var(--btn-orange);
      color: var(--btn-orange);
    }

    .ut-btn.accent:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* Main Stage */
    .stage-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .canvas-frame {
      width: 100%;
      max-width: 640px;
      background: #000;
      border: 3px solid #fff;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.85);
      position: relative;
      overflow: hidden;
    }

    canvas#game {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      outline: none;
    }

    /* Live Walkthrough Hint Bar */
    .hint-bar {
      width: 100%;
      max-width: 640px;
      background: #000;
      border: 2px solid var(--border-dim);
      padding: 7px 11px;
      font-family: "Determination Mono", "PingFang TC", monospace;
      font-size: 13px;
      line-height: 1.35;
      color: #e4e4ec;
    }

    /* Touch Gamepad + Desktop Key Legend */
    .controls-deck {
      width: 100%;
      max-width: 640px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px;
    }

    /* Unified Slideable 8-Way D-Pad */
    .dpad-surface {
      width: 138px;
      height: 138px;
      position: relative;
      touch-action: none;
      flex-shrink: 0;
    }

    .dpad-cross {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3px;
      pointer-events: none;
    }

    .dpad-arm {
      background: #111116;
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      transition: background 0.06s, border-color 0.06s, color 0.06s;
    }

    .dpad-arm.active {
      background: #2b2610;
      border-color: var(--gold);
      color: var(--gold);
    }

    .dpad-center {
      background: #0b0b0f;
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--soul);
      font-size: 12px;
    }

    .desktop-legend {
      font-family: "Determination Mono", monospace;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .desktop-legend kbd {
      background: var(--surface-2);
      border: 1px solid var(--border-dim);
      padding: 1px 5px;
      color: var(--fg);
    }

    /* Action Buttons (Z, X, C) */
    .action-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      touch-action: none;
      flex-shrink: 0;
    }

    .act-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #0f0f15;
      border: 2.5px solid #fff;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      font-family: "Determination Mono", monospace;
    }

    .act-btn .k {
      font-size: 19px;
      font-weight: 700;
      line-height: 1;
    }

    .act-btn .sub {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    .act-btn.z-btn {
      width: 62px;
      height: 62px;
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-10px);
    }

    .act-btn.c-btn {
      width: 48px;
      height: 48px;
      border-color: var(--btn-orange);
      color: var(--btn-orange);
      transform: translateY(-18px);
    }

    .act-btn.active {
      background: #2b2310;
      transform: scale(0.92);
    }

    /* Walkthrough Drawer */
    .wt-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(400px, 92vw);
      background: #09090d;
      border-left: 3px solid #fff;
      z-index: 100;
      transform: translateX(102%);
      transition: transform 0.22s ease;
      display: flex;
      flex-direction: column;
    }

    .wt-drawer.open {
      transform: translateX(0);
    }

    .wt-hdr {
      padding: 12px 14px;
      border-bottom: 2px solid var(--border-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #000;
    }

    .wt-hdr h2 {
      margin: 0;
      font-size: 16px;
      color: var(--gold);
    }

    .wt-body {
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .wt-step {
      background: #101017;
      border: 2px solid var(--border-dim);
      padding: 10px;
    }

    .wt-step.current {
      border-color: var(--gold);
      background: #1a180d;
    }

    .wt-step-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .wt-step-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .wt-jump-btn {
      background: #000;
      color: var(--gold);
      border: 1.5px solid var(--gold);
      padding: 3px 8px;
      font-family: "Determination Mono", monospace;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .wt-step-tip {
      margin: 6px 0 0;
      font-size: 12.5px;
      line-height: 1.4;
      color: #cccce0;
      font-family: "Determination Mono", "PingFang TC", monospace;
    }

    /* Mobile Portrait Optimization */
    @media (max-width: 640px) {
      .app-shell { padding: 6px 6px env(safe-area-inset-bottom, 8px); gap: 6px; }
      .topbar { padding: 6px 8px; }
      .brand-text h1 { font-size: 13.5px; }
      .desktop-legend { display: none; }
      .ut-btn, .ut-select { font-size: 11px; padding: 4px 6px; }
      .ut-select { max-width: 132px; }
      .hint-bar { font-size: 12px; overflow-wrap: anywhere; }
    }

    /* Landscape Mobile & Fullscreen Immersive Mode */
    @media (max-height: 520px) and (orientation: landscape) {
      .topbar, .hint-bar, .desktop-legend { display: none; }
      .app-shell { padding: 0; max-width: none; height: 100dvh; justify-content: center; }
      .stage-wrap { justify-content: center; height: 100dvh; position: relative; }
      .canvas-frame { height: 96dvh; width: auto; aspect-ratio: 4 / 3; max-width: none; }
      canvas#game { height: 100%; width: auto; }
      .controls-deck {
        position: fixed; inset: auto 12px 12px 12px; max-width: none; width: auto; pointer-events: none;
      }
      .dpad-surface, .action-cluster { pointer-events: auto; opacity: 0.86; }
    }

    body.immersive .topbar, body.immersive .hint-bar, body.immersive .desktop-legend { display: none; }
    body.immersive .app-shell { max-width: none; height: 100dvh; padding: 4px; justify-content: center; }
    body.immersive .canvas-frame { max-height: 92dvh; width: auto; aspect-ratio: 4 / 3; }
    body.immersive canvas#game { max-height: 91dvh; width: auto; }
    body.immersive .controls-deck {
      position: fixed; left: 16px; right: 16px; bottom: 14px; max-width: none; width: auto; pointer-events: none;
    }
    body.immersive .dpad-surface, body.immersive .action-cluster { pointer-events: auto; opacity: 0.85; }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="soul-badge" aria-hidden="true">♥</span>
        <div class="brand-text">
          <h1>UNDERTALE — RUINS &amp; SNOWDIN</h1>
          <p id="roomLabel">Intro Story (#1)</p>
        </div>
      </div>
      <div class="toolbar">
        <select id="roomJumpSel" class="ut-select" aria-label="Jump to Scene">
          <option value="">Jump Scene ▾</option>
        </select>
        <button id="btnUndyne" class="ut-btn hero" type="button" title="Undyne the Undying — Battle Against a True Hero">💚 Undying</button>
        <a class="ut-btn hero" href="undyne.html" title="Standalone Undyne the Undying Simulator (Waves / Practice)">⚔ Sim</a>
        <button id="btnAsriel" class="ut-btn rainbow" type="button" title="Asriel Dreemurr — 7 SOULs Boss Fight Simulator">★ Asriel</button>
        <a class="ut-btn rainbow" href="asriel.html" title="Standalone Asriel Boss Simulator (Normal / Practice / Single Attacks)">🌈 Sim</a>
        <button id="btnShield" class="ut-btn" type="button" title="Toggle No-Hit Invincibility Shield in Battles">🛡 Shield OFF</button>
        <button id="btnGeno" class="ut-btn" type="button" title="Toggle Genocide Route (or grind kills naturally)">☠ Genocide 0/20</button>
        <button id="btnWalkthrough" class="ut-btn accent" type="button">📖 Guide</button>
        <button id="btnLang" class="ut-btn" type="button">EN / 繁中</button>
        <button id="btnMute" class="ut-btn" type="button">🔊 Audio</button>
        <button id="btnFullscreen" class="ut-btn" type="button" title="Toggle Immersive View">⛶ Full</button>
      </div>
    </header>

    <section class="stage-wrap">
      <div class="canvas-frame">
        <canvas id="game" width="640" height="480" tabindex="0" aria-label="Undertale The Ruins Game Screen"></canvas>
      </div>

      <div id="liveWalkthroughHint" class="hint-bar">
        ♥ Watch the 11-panel legend of Humans &amp; Monsters, or press [X] to skip straight to the Title Screen.
      </div>

      <div class="controls-deck">
        <div id="dpadZone" class="dpad-surface" aria-label="8-Way Touch Directional Pad">
          <div class="dpad-cross">
            <div></div>
            <div class="dpad-arm" data-dpad="up">▲</div>
            <div></div>
            <div class="dpad-arm" data-dpad="left">◀</div>
            <div class="dpad-center">♥</div>
            <div class="dpad-arm" data-dpad="right">▶</div>
            <div></div>
            <div class="dpad-arm" data-dpad="down">▼</div>
            <div></div>
          </div>
        </div>

        <div class="desktop-legend">
          <div><kbd>↑↓←→</kbd> / <kbd>WASD</kbd> Move</div>
          <div><kbd>Z</kbd> Confirm · <kbd>X</kbd> Cancel/Run · <kbd>C</kbd> Menu/Phone</div>
        </div>

        <div class="action-cluster">
          <button id="btnActC" class="act-btn c-btn" type="button" aria-label="Menu and Cell Phone">
            <span class="k">C</span>
            <span class="sub">MENU</span>
          </button>
          <button id="btnActX" class="act-btn x-btn" type="button" aria-label="Cancel or Skip">
            <span class="k">X</span>
            <span class="sub">SKIP</span>
          </button>
          <button id="btnActZ" class="act-btn z-btn" type="button" aria-label="Confirm or Interact">
            <span class="k">Z</span>
            <span class="sub">OK</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <aside id="wtDrawer" class="wt-drawer" aria-label="Full Walkthrough">
    <div class="wt-hdr">
      <h2>♥ FULL RUINS &amp; SNOWDIN GUIDE</h2>
      <button id="btnCloseWt" class="ut-btn" type="button">✕ Close</button>
    </div>
    <div id="wtList" class="wt-body"></div>
  </aside>

  <script src="assets/core_assets.js"></script>
  <script src="assets/asriel_assets.js"></script>
  <script src="assets/undyne_assets.js"></script>
  <script src="assets/rooms_data.js"></script>
  <script src="assets/dialogue.js"></script>
  <script src="assets/battle_engine.js"></script>
  <script src="assets/asriel_engine.js"></script>
  <script src="assets/undyne_engine.js"></script>
  <script src="assets/overworld.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
